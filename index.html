<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=http://172.23.89.10/system/setting">
<title>正在跳转...</title>
<style>
body{margin:0;padding:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#333}
.box{text-align:center;padding:30px}
.loading{display:inline-block;width:30px;height:30px;border:3px solid #e0e0e0;border-top:3px solid #667eea;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
p{margin:8px 0;font-size:14px;color:#666}
a{color:#667eea;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="loading"></div>
  <p>正在跳转，请稍候...</p>
  <p>如果没有自动跳转，请<a href="http://172.23.89.10/system/setting">点击这里</a></p>
</div>
<script>
window.location.replace('http://172.23.89.10/system/setting');
</script>
</body>
</html>
