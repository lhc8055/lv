<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星柚电竞 · 游戏陪玩开黑</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=ZCOOL+KuaiLe&display=swap">
<style>
:root{
  --pri:#5b6cf0;--pri-soft:#eef0ff;--purple:#8a63ff;
  --ink:#22264b;--sub:#8b90b2;--weak:#b3b8d6;
  --bg:#f3f5fc;--card:#fff;--line:#eceef8;--red:#ff4d4f;
  --r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:20px;--r-xl:24px;
  --shadow:0 8px 24px rgba(84,99,220,.10);
  --shadow-sm:0 4px 12px rgba(84,99,220,.08);
  --tab-h:56px;--head-h:56px;
  --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-cute:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font-body);color:var(--ink);-webkit-font-smoothing:antialiased;
  background:#f3f5fc}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;touch-action:manipulation}
input,select,textarea{font-family:inherit;outline:none;border:none;background:none;color:inherit}
img{display:block}
ul{list-style:none}
a{color:inherit;text-decoration:none}

#app{display:flow-root;position:relative;width:100%;max-width:460px;min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 0 60px rgba(70,80,160,.18);
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));overflow:clip}
@media(min-width:480px){body{padding:0}#app{min-height:100vh;border-radius:0}}

.notice{display:flex;align-items:center;gap:8px;padding:9px 14px;background:linear-gradient(90deg,#fff7e0,#fff2d2);color:#e2492d;font-size:12.5px;font-weight:500;line-height:1.4}
.notice>svg{flex:none;width:15px;height:15px}
.notice .n-close{margin-left:auto;flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#d8906f}
.notice.hide{display:none}

.section-title{display:flex;align-items:center;margin:20px 16px 12px;font-size:16px;font-weight:800}
.section-title .more{margin-left:auto;display:flex;align-items:center;gap:2px;font-size:12px;font-weight:400;color:var(--sub)}
.section-title .more svg{width:13px;height:13px}

.searchbar{display:flex;align-items:center;gap:8px;margin:12px 14px;padding:0 12px 0 14px;height:40px;background:#fff;border-radius:999px;border:1.5px solid #2563eb}
.searchbar .s-go{flex:none;width:30px;height:30px;margin:0 -6px;display:flex;align-items:center;justify-content:center;color:#9ca3af}
.searchbar .s-go svg{width:18px;height:18px}
.searchbar input{flex:1;min-width:0;font-size:14px;color:var(--ink)}
.searchbar input::placeholder{color:#9ca3af}
.s-clear{display:none;flex:none;width:18px;height:18px;border-radius:50%;background:#cfd3e6;color:#fff;align-items:center;justify-content:center}
.s-clear.show{display:flex}
.s-clear svg{width:10px;height:10px}

.banner{position:relative;margin:4px 14px 0;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:2048/896;background:#dbe4ff}
.banner img{width:100%;height:100%;object-fit:cover}
.banner .b-text{position:absolute;top:0;right:0;width:54%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-right:12px}
.banner .b-name{font-family:var(--font-cute);font-size:30px;line-height:1.1;color:#fff;letter-spacing:2px;
  text-shadow:-1.5px -1.5px 0 #7d8cff,1.5px -1.5px 0 #7d8cff,-1.5px 1.5px 0 #7d8cff,1.5px 1.5px 0 #7d8cff,0 3px 0 #6472ec,0 6px 12px rgba(90,104,230,.35)}
.banner .b-sub{margin-top:13px;font-size:10.5px;color:#4a53b0;font-weight:700;line-height:1.9;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.95);padding:7px 11px;border-radius:var(--r-sm);box-shadow:0 3px 8px rgba(110,123,255,.18)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 14px 0}
.quick-card{position:relative;border-radius:var(--r-md);overflow:hidden;aspect-ratio:1536/1024;box-shadow:var(--shadow-sm);transition:transform .12s}
.quick-card:active{transform:scale(.97)}
.quick-card img{width:100%;height:100%;object-fit:cover}
.quick-card .q-center{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px}
.quick-card.hot .q-center{left:47%;right:5%}
.quick-card.all .q-center{left:5%;right:50%}
.quick-card .q-title{font-family:var(--font-cute);font-size:18px;letter-spacing:1px;color:#ff5d9e;text-shadow:0 2px 0 #fff,0 2px 6px rgba(255,255,255,.9)}
.quick-card .q-btn{margin-top:2px;font-size:10.5px;font-weight:600;padding:4px 13px;border-radius:999px}
.quick-card.hot .q-btn{color:#e07a5f;background:rgba(255,218,193,.85)}
.quick-card.all .q-btn{color:#5b8c85;background:rgba(181,234,215,.85)}

.games,.cat-game-row,.order-tabs{scrollbar-width:none}
.games::-webkit-scrollbar,.cat-game-row::-webkit-scrollbar,.order-tabs::-webkit-scrollbar{display:none}
.games{display:flex;align-items:flex-start;flex-wrap:nowrap;overflow-x:auto}
.game{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;transition:transform .12s}
.game:active{transform:scale(.94)}
.gicon{--gr:14px;position:relative;display:flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:var(--gr);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.gicon img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.gicon.all{background:linear-gradient(150deg,#dfe6ff,#cfd8ff)}
.gicon.all svg{width:26px;height:26px;color:var(--pri)}
.gname{font-size:12px;font-weight:500;color:#9ca3af}
.game.on .gicon{overflow:visible;box-shadow:0 6px 18px rgba(139,92,246,.32)}
.game.on .gicon::before{content:"";position:absolute;inset:-6px;border-radius:calc(var(--gr) + 6px);
  padding:2.5px;background:linear-gradient(135deg,#7c5cff 0%,#b98cff 45%,#ff9ad5 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;animation:gameRingIn .5s ease-out both}
@keyframes gameRingIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.game.on .gname{color:#7c3aed;font-weight:700}
.home-games{gap:20px;padding:20px 16px 12px}
.home-games .game{width:68px}
.home-games .gicon{--gr:13px;width:52px;height:52px}
.home-games .gname{font-size:11.5px;white-space:nowrap}
.home-follow{will-change:transform}

.no-more{text-align:center;color:#a5a9c4;font-size:12px;padding:18px 0 6px}
.no-more::before,.no-more::after{content:"";display:inline-block;width:20px;height:1px;background:#dfe2f0;vertical-align:middle;margin:0 8px}

.goods-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 14px}
.gcard{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .12s}
.gcard:active{transform:scale(.97)}
.gcard .g-img{position:relative;aspect-ratio:1/1;background:#e3e9ff}
.gcard .g-img img{width:100%;height:100%;object-fit:cover}
.gcard .g-tag{position:absolute;left:8px;top:8px;font-size:10px;color:#fff;font-weight:500;padding:3px 8px;border-radius:var(--r-xs);background:linear-gradient(135deg,rgba(255,93,126,.92),rgba(255,138,92,.92))}
.gcard .g-body{display:flex;flex-direction:column;gap:6px;padding:10px 10px 12px}
.gcard .g-title{font-size:13px;font-weight:700;line-height:1.4;height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .g-tags{display:flex;gap:5px;overflow:hidden}
.gcard .g-tags span{flex:none;font-size:10px;color:var(--pri);background:var(--pri-soft);padding:2px 6px;border-radius:6px;white-space:nowrap}
.gcard .g-foot{display:flex;align-items:baseline;justify-content:space-between;margin-top:2px}
.gcard .g-price{color:var(--red);font-weight:900;font-size:16px}
.gcard .g-price small{font-size:10px;font-weight:500}
.gcard .g-heat{font-size:10.5px;color:var(--weak)}

.cat-game-row{display:flex;align-items:flex-start;padding:16px 12px 14px;overflow-x:auto}
.cat-game-row .game{width:81px;gap:9px}
.cat-game-row .gicon{--gr:12px;width:48px;height:48px}
.cat-game-row .gname{font-size:12.5px;color:#4b5068}
.cat-game-row .game.on .gname{color:#7c3aed;font-weight:800}
.cat-wrap{display:flex;align-items:flex-start;gap:10px;padding:0 10px 14px}
.cat-side{flex:none;width:88px;background:#fff;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-sm)}
.cat-side .zone{position:relative;display:block;width:100%;text-align:left;padding:15px 12px;font-size:12px;line-height:1.3;color:#9a9eb5;background:#fff}
.cat-side .zone.on{background:#f4f5fa;color:var(--ink);font-weight:800}
.cat-side .zone.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#a78bfa,#7c3aed)}
.cat-main{flex:1;min-width:0;background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow-sm);min-height:340px;padding-bottom:8px}
.sortbar{display:flex;align-items:center;justify-content:center;gap:16px;height:44px;margin:0 8px;border-bottom:1px solid #eeeff5;font-size:13px;color:#9a9ab0}
.cat-main .sortbar{position:sticky;top:0;z-index:6;margin:0;padding:0 8px;border-bottom:none;background:#fff;border-radius:var(--r-md) var(--r-md) 0 0}
.cat-main .sortbar::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:1px;background:#eeeff5}
.sortbar .sort{display:flex;align-items:center;gap:4px;padding:6px 2px;color:#9a9ab0}
.sortbar .sort.on{color:var(--ink);font-weight:800}
.sort-arrows{display:inline-flex;flex-direction:column;gap:2px}
.sort-arrows i{display:block;width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent}
.sort-arrows i.up{border-bottom:4.5px solid #c9cde0}
.sort-arrows i.down{border-top:4.5px solid #c9cde0}
.sort-arrows i.up.on{border-bottom-color:#7c3aed}
.sort-arrows i.down.on{border-top-color:#7c3aed}
.grow{display:flex;gap:12px;width:100%;text-align:left;padding:12px;border-bottom:1px solid #f4f5fa;transition:background .12s}
.grow:last-of-type{border-bottom:none}
.grow:active{background:#f7f8fd}
.grow .gr-img{flex:none;width:76px;height:76px;border-radius:var(--r-sm);overflow:hidden;background:#e3e9ff}
.grow .gr-img img{width:100%;height:100%;object-fit:cover}
.grow .gr-body{flex:1;min-width:0;min-height:76px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.grow .gr-title{font-size:13.5px;font-weight:800;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grow .gr-rank{margin-top:3px;font-size:11px;color:#a3a6b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .gr-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.grow .gr-price{color:var(--red);font-weight:800;font-size:17px;line-height:1;white-space:nowrap}
.grow .gr-price small{font-size:11px;font-weight:500}
.grow .gr-heat{font-size:11.5px;color:#a3a6b8;white-space:nowrap;line-height:1}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:56px 24px;text-align:center;color:var(--sub);font-size:13px;line-height:1.7}
.empty .e-ico{width:84px;height:84px;margin-bottom:8px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center}
.empty .e-ico svg{width:38px;height:38px;stroke-width:1.6}
.empty b{font-size:15px;font-weight:800;color:var(--ink)}
.empty .e-btn{margin-top:10px;padding:9px 26px;border-radius:999px;background:linear-gradient(135deg,var(--pri),var(--purple));color:#fff;font-size:13px;font-weight:700;box-shadow:0 6px 14px rgba(91,108,240,.28)}
.empty .e-btn:active{transform:scale(.97)}

.pf-header{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:40px 20px 24px;text-align:center}
button.pf-header:active{opacity:.8}
.pf-avatar{position:relative;width:88px;height:88px;border-radius:50%;overflow:hidden;margin:0 auto 14px;box-shadow:0 6px 20px rgba(91,108,240,.18);border:3px solid #fff}
.pf-avatar img{width:100%;height:100%;object-fit:cover}
.pf-avatar-off img{filter:brightness(.6)}
.pf-avatar-mask{position:absolute;inset:0;border-radius:50%;background:rgba(100,110,130,.25)}
.pf-name{font-size:20px;font-weight:800}
.pf-id{font-size:13px;color:var(--sub);margin-top:4px}
.pf-section{padding:0 16px}
.pf-sec-title{font-size:15px;font-weight:700;margin:8px 4px 12px}
.pf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 4px;background:#fff;border-radius:var(--r-lg);padding:18px 10px;box-shadow:var(--shadow-sm)}
.pf-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.pf-ico{width:44px;height:44px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.pf-ico svg{width:22px;height:22px}
.pf-ico.f-blue{background:linear-gradient(135deg,#60a5fa,#3b82f6)}
.pf-ico.f-yellow{background:linear-gradient(135deg,#ffe17a 0%,#ffb02e 50%,#ff9500 100%);box-shadow:0 3px 12px rgba(255,176,46,.35)}
.pf-ico.f-pink{background:linear-gradient(135deg,#f9a8d4,#ec4899)}
.pf-ico.f-orange{background:linear-gradient(135deg,#fb923c,#f97316)}
.pf-ico.f-purple{background:linear-gradient(135deg,#a78bfa,#8b5cf6)}
.pf-ico.f-gray{background:linear-gradient(135deg,#9ca3af,#6b7280)}
.pf-label{font-size:11.5px;color:#555b85;font-weight:500}
.pf-badge{position:absolute;top:-4px;right:calc(50% - 30px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

.d-back{flex:none;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center}
.d-back svg{width:18px;height:18px}
.page-head{position:sticky;position:-webkit-sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:var(--head-h);padding:0 12px;background:rgba(243,245,252,.92);backdrop-filter:blur(10px)}
.page-head h1{font-size:16px;font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.order-tabs{display:flex;gap:8px;padding:2px 14px 12px;position:sticky;position:-webkit-sticky;top:var(--head-h);z-index:19;background:linear-gradient(180deg,var(--bg) 75%,rgba(243,245,252,0));overflow-x:auto;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.order-tabs button{flex:none;font-size:12.5px;color:var(--sub);padding:7px 16px;border-radius:999px;background:#fff;box-shadow:var(--shadow-sm);white-space:nowrap;touch-action:manipulation;cursor:pointer}
.order-tabs button.on{background:linear-gradient(135deg,var(--pri),var(--purple));color:#fff;font-weight:700}
.order-list{padding:0 14px}
.order-card{margin-bottom:12px;background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:14px}
.oc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--sub);padding-bottom:10px;border-bottom:1px dashed var(--line)}
.oc-status{flex:none;font-weight:700;font-size:12px}
.oc-status.unpaid,.oc-status.pending{color:#ff8a2e}
.oc-status.ongoing{color:var(--pri)}
.oc-status.done{color:#12b779}
.oc-status.refunding,.oc-status.refunded,.oc-status.cancelled{color:#9aa0c4}
.oc-body{display:flex;gap:12px;padding:12px 0}
.oc-img{flex:none;width:64px;height:64px;border-radius:var(--r-sm);overflow:hidden;background:#e3e9ff}
.oc-img img{width:100%;height:100%;object-fit:cover}
.oc-info{flex:1;min-width:0}
.oc-name{font-size:13.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oc-meta{font-size:11.5px;color:var(--sub);margin-top:5px;line-height:1.5;word-break:break-all}
.oc-right{flex:none;text-align:right;color:var(--red);font-weight:900;font-size:15px}
.oc-rate{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);padding:9px 0}
.oc-rate .stars-mini{color:#ffb53d;letter-spacing:1px}
.oc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:12px;border-top:1px dashed var(--line)}
.oc-total{font-size:12.5px;color:var(--sub)}
.oc-total b{color:var(--red);font-size:16px;font-weight:900}
.oc-actions{display:flex;gap:8px}
.oc-btn{font-size:12px;color:var(--pri);border:1px solid var(--pri);padding:6px 14px;border-radius:999px;white-space:nowrap}
.oc-btn.gray{color:#9aa0c4;border-color:#d6daf0;background:#f6f7fc}
.oc-btn.solid{color:#fff;background:linear-gradient(135deg,var(--pri),var(--purple));border-color:transparent;font-weight:700}

.coupon{position:relative;margin:0 14px 14px;border-radius:var(--r-md);overflow:hidden;background:linear-gradient(120deg,#6e7bff,#8a63ff);color:#fff;display:flex;min-height:108px;box-shadow:var(--shadow)}
.coupon.c2{background:linear-gradient(120deg,#ff9a5c,#ff6a8d)}
.coupon.c3{background:linear-gradient(120deg,#39c6ff,#5b6cf0)}
.coupon.used,.coupon.expired{filter:grayscale(.85);opacity:.5}
.coupon .c-left{flex:none;width:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:2px dashed rgba(255,255,255,.55);position:relative}
.coupon .c-left::before,.coupon .c-left::after{content:"";position:absolute;right:-9px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.coupon .c-left::before{top:-9px}
.coupon .c-left::after{bottom:-9px}
.coupon .c-price{font-family:var(--font-cute);font-size:34px;line-height:1}
.coupon .c-price small{font-size:15px}
.coupon .c-cond{font-size:10.5px;opacity:.9;margin-top:5px}
.coupon .c-right{flex:1;min-width:0;padding:14px 15px 40px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.coupon .c-name{font-size:15px;font-weight:800}
.coupon .c-desc{font-size:11px;opacity:.92;line-height:1.5}
.coupon .c-get{position:absolute;right:14px;bottom:12px;font-size:11.5px;background:#fff;color:var(--pri);padding:5px 14px;border-radius:999px;font-weight:700}
.coupon.c2 .c-get{color:#ff6a5d}
.coupon.c3 .c-get{color:#3b82f6}
.coupon .c-got{position:absolute;right:14px;bottom:13px;font-size:11.5px;opacity:.85}
.coupon .c-shine{position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transform:skewX(-20deg);pointer-events:none;animation:cpShine 4s ease-in-out infinite}
@keyframes cpShine{0%,100%{left:-60%}50%{left:120%}}

.detail-hero{margin:0 14px;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:1/1;background:#dfe6ff}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-price,.detail-block{margin:12px 14px 0;background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:16px}
.detail-price .dp-row{display:flex;align-items:baseline;gap:9px}
.detail-price .dp-price{font-size:30px;font-weight:900;color:var(--red);line-height:1}
.detail-price .dp-price small{font-size:14px;font-weight:700}
.detail-price .dp-heat{margin-left:auto;font-size:11.5px;color:var(--weak)}
.detail-price h2{font-size:17px;font-weight:800;margin-top:12px;line-height:1.4}
.detail-price .dp-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}

<script>
var _fabLocked=false;
var _fabPct=58;
function positionFab(){
  var fab=document.getElementById('fabBtn');if(!fab)return;
  var games=document.querySelector('.home-games');
  var grid=document.querySelector('.goods-grid');
  var section=document.querySelector('.section-title');
  if(games){
    var gEnd=games.getBoundingClientRect().bottom;
    var bottomBound=gEnd+80;
    if(grid){bottomBound=grid.getBoundingClientRect().top;}
    else if(section){bottomBound=section.getBoundingClientRect().top;}
    var mid=(gEnd+bottomBound)/2;
    var vh=window.innerHeight||document.documentElement.clientHeight;
    if(vh>0){_fabPct=Math.round(mid/vh*100);}
  }
  fab.style.top=_fabPct+'%';
  fab.style.bottom='auto';
  fab.style.transform='translateY(-50%)';
}
window.addEventListener('load',function(){positionFab();setTimeout(function(){try{hidePageLoader()}catch(e){var p=document.getElementById('pageLoader');if(p)p.classList.remove('show')}},100)});setTimeout(function(){try{hidePageLoader()}catch(e){var p=document.getElementById('pageLoader');if(p)p.classList.remove('show')}},2000);
setTimeout(positionFab,300);
setTimeout(positionFab,800);
setTimeout(positionFab,1200);
setTimeout(function(){try{hidePageLoader()}catch(e){var p=document.getElementById('pageLoader');if(p)p.classList.remove('show')}},500);
window.addEventListener('resize',function(){_fabLocked=false;positionFab();});
window.addEventListener('orientationchange',function(){_fabLocked=false;setTimeout(positionFab,300);});
</script>

function parseHash(){
  const h=(location.hash||"#/home").replace(/^#\/?/,"");
  const parts=h.split("?");
  const params={};
  if(parts[1]){
    parts[1].split("&").forEach(kv=>{
      const i=kv.indexOf("=");
      const k=i<0?kv:kv.slice(0,i);
      const v=i<0?"":kv.slice(i+1);
      try{params[decodeURIComponent(k)]=decodeURIComponent(v);}catch(e){}
    });
  }
  return {name:parts[0]||"home",params};
}

    transform:"translate("+d.left+"px,"+d.top+"px) scale("+s+")",
    borderRadius:d.radii.map(v=>(v/s)+"px").join(" ")
  };
  if(useClip) o.clipPath="inset("+(d.clipT/s)+"px 0px "+(d.clipB/s)+"px 0px)";
  return o;
}
function makeFly(src,base,first){
  const fly=document.createElement("div");
  fly.className="hero-fly";
  const im=document.createElement("img");
  im.alt="";
  im.decoding="async";
  im.src=src;
  fly.appendChild(im);
  fly.style.width=base.width+"px";
  fly.style.height=base.height+"px";
  Object.assign(fly.style,flyKf(first,base,false));
  document.body.appendChild(fly);
  const dec=im.decode?im.decode().catch(()=>{}):Promise.resolve();
  return {fly,ready:Promise.race([dec,new Promise(r=>setTimeout(r,120))])};
}
function boxKf(d){
  return {left:px(d.r.left),top:px(d.r.top),width:px(d.r.width),height:px(d.r.height),borderRadius:d.radii.map(px).join(" "),boxShadow:d.shadow?SH:SH0};
}
function boxTfKf(from,to){
  const sx=to.r.width/from.r.width,sy=to.r.height/from.r.height;
  const tx=to.r.left-from.r.left,ty=to.r.top-from.r.top;
  const br=to.radii.map(v=>(v/sx)+"px").join(" ");
  return [
    {transform:"translate(0px,0px) scale(1,1)",borderRadius:from.radii.map(px).join(" "),boxShadow:from.shadow?SH:SH0},
    {transform:"translate("+tx+"px,"+ty+"px) scale("+sx+","+sy+")",borderRadius:br,boxShadow:to.shadow?SH:SH0}
  ];
}
function bodyTf(sm,bg){
  return {
    s:R=>{const k=R.width/sm.bw;return "translate("+(R.left-k*sm.ox)+"px,"+(R.top-k*sm.oy)+"px) scale("+k+")";},
    b:R=>{const k=R.width/bg.r.width;return "translate("+R.left+"px,"+R.top+"px) scale("+k+")";}
  };
}
function makeBody(sm,bg,forward){
  const F=forward?sm:bg;
  const tf=bodyTf(sm,bg);
  const box=document.createElement("div");
  box.className="hero-box";
  Object.assign(box.style,boxKf(F),{transformOrigin:"0 0"});
  sm.clone.style.transform=tf.s(F.r);
  bg.clone.style.transform=tf.b(F.r);
  (forward?bg.clone:sm.clone).style.opacity="0";
  document.body.append(box,sm.clone,bg.clone);
  return {box,sm,bg,forward,all:[box,sm.clone,bg.clone]};
}
function animBody(L){
  const {sm,bg,forward}=L;
  const tf=bodyTf(sm,bg);
  const F=forward?sm:bg,T=forward?bg:sm;
  const o={duration:FX_MS,easing:FX_EASE,fill:"both"};
  const fo=[[0,1],[.45,0],[1,0]],fi=[[0,0],[.2,0],[.7,1],[1,1]];
  const mk=(f0,f1,ops)=>ops.map(([off,a])=>{const k={offset:off,opacity:a};if(off===0) k.transform=f0;if(off===1) k.transform=f1;return k;});
  L.box.animate(boxTfKf(F,T),o);
  sm.clone.animate(mk(tf.s(F.r),tf.s(T.r),forward?fo:fi),o);
  bg.clone.animate(mk(tf.b(F.r),tf.b(T.r),forward?fi:fo),o);
}
function stripIds(node){
  node.querySelectorAll("[id]").forEach(n=>{n.setAttribute("data-oid",n.id);n.removeAttribute("id");});
}
function restoreIds(node){
  node.querySelectorAll("[data-oid]").forEach(n=>{n.id=n.getAttribute("data-oid");n.removeAttribute("data-oid");});
  node.querySelectorAll("[data-hero],[data-herobody]").forEach(n=>{n.removeAttribute("data-hero");n.removeAttribute("data-herobody");});
}
function makeGhost(node,y,toY){
  const view=$("#view");
  const probe=node.querySelector(".detail-hero,.searchbar,.goods-grid,.order-list,.empty,.coupon,.pf-header")||node;
  const t0=probe.getBoundingClientRect().top;
  const g=document.createElement("div");
  g.className="view-ghost";
  g.setAttribute("aria-hidden","true");
  g.inert=true;
  g.style.top="0px";
  g.style.willChange="opacity";
  stripIds(node);
  const bar=node.querySelector(".detail-bar");
  if(bar){
    bar.style.pointerEvents="none";
    bar.inert=true;
    document.body.appendChild(bar);
    g._bar=bar;
  }
  g.appendChild(node);
  view.after(g);
  const t1=probe.getBoundingClientRect().top+window.scrollY;
  g.style.top=(t0+toY-t1)+"px";
  return g;
}
function killGhost(g){
  if(!g) return;
  if(g._bar) g._bar.remove();
  g.remove();
}
function fadeGhost(ghost,cb){
  if(ghost._bar) ghost._bar.animate([{opacity:1},{opacity:0}],{duration:180,easing:"ease-out",fill:"forwards"});
  ghost.animate([{opacity:1},{opacity:0}],{duration:260,easing:"ease-out",fill:"forwards"}).onfinish=()=>{killGhost(ghost);if(cb) cb();};
}
function playHero(t,ghost){
  const hero=$(".detail-hero");
  if(!hero||!ghost){killGhost(ghost);fxOff();return;}
  if(FX_LITE){fadeGhost(ghost,fxOff);return;}
  const h=heroDesc(hero);
  const price=$("#view .detail-price");
  const bar=$(".detail-bar");
  const {fly,ready}=makeFly(t.src,h,t.card);
  const body=FX_BODY&&t.body&&price?makeBody(t.body,priceDesc(price),true):null;
  hero.style.opacity=".01";
  if(body) price.style.opacity=".01";
  if(bar) bar.style.opacity="0";
  let ended=false;
  const end=()=>{
    if(ended) return;
    ended=true;
    hero.style.opacity="";
    if(body) price.style.opacity="";
    if(bar) bar.style.opacity="";
    killGhost(ghost);
    requestAnimationFrame(()=>{fly.remove();if(body) body.all.forEach(e=>e.remove());fxOff();});
  };
  setTimeout(end,FX_MS+800);
  ready.then(()=>{
    if(ended) return;
    const hh=heroDesc(hero);
    const uc=!!(t.card.clipT||hh.clipT);
    const a=fly.animate([flyKf(t.card,h,uc),flyKf(hh,h,uc)],{duration:FX_MS,easing:FX_EASE,fill:"both"});
    a.onfinish=end;
    a.oncancel=end;
    if(body){body.bg.r=rectOf(price);animBody(body);}
    if(bar) bar.animate([{opacity:0},{opacity:1}],{duration:260,delay:220,easing:"ease-out",fill:"both"});
    fadeGhost(ghost);
  });
}
function playBack(fx,leftId,ghost){
  Promise.resolve().then(()=>{
    let card=null,im=null,el=null;
    if(fx){
      el=$('#view [data-action="detail"][data-id="'+leftId+'"]');
      const box=el&&el.querySelector(".g-img,.gr-img");
      im=box&&box.querySelector("img");
      if(box){
        const c=cardDesc(box);
        if(c.top<window.innerHeight&&c.top+c.height>0&&c.height-c.clipT>c.height*.4) card=c;
      }
    }
    if(FX_LITE||!card||!im){
      fadeGhost(ghost,fxOff);
      return;
    }
    const gh=ghost.querySelector(".detail-hero");
    if(gh) gh.style.visibility="hidden";
    const h=fx.h;
    const {fly,ready}=makeFly(fx.src,h,h);
    let body=null;
    if(FX_BODY&&fx.price){
      const sm=bodyDesc(el);
      if(sm){
        body=makeBody(sm,fx.price,false);
        const gp=ghost.querySelector(".detail-price");
        if(gp) gp.style.visibility="hidden";
      }
    }
    const hid=body?el:im;
    hid.style.opacity=".01";
    let ended=false;
    const end=()=>{
      if(ended) return;
      ended=true;
      hid.style.opacity="";
      killGhost(ghost);
      requestAnimationFrame(()=>{fly.remove();if(body) body.all.forEach(e=>e.remove());fxOff();});
    };
    setTimeout(end,FX_MS+800);
    ready.then(()=>{
      if(ended) return;
      const uc=!!(h.clipT||card.clipT);
      const a=fly.animate([flyKf(h,h,uc),flyKf(card,h,uc)],{duration:FX_MS,easing:FX_EASE,fill:"both"});
      a.onfinish=end;
      a.oncancel=end;
      if(body) animBody(body);
      fadeGhost(ghost);
    });
  });
}

function render(keepScroll){
  let r=parseHash();
  let needLogin=false;
  if(!store.user&&AUTH_ROUTES.includes(r.name)){
    history.replaceState(null,"","#/profile");
    r=parseHash();
    needLogin=true;
  }
  if(!VIEWS[r.name]){location.hash="#/home";return;}
  document.querySelectorAll(".tabbar .tab").forEach(t=>t.classList.toggle("on",t.dataset.route===TAB_OF[r.name]));
  const y=window.scrollY;
  const prev=lastRoute,leftId=curDetailId;
  lastRoute=r.name;
  if(r.name==="detail") curDetailId=parseInt(r.params.id,10)||0;
  let ret=null;
  if(prev==="detail"&&r.name!=="detail"&&retInfo&&retInfo.hash===location.hash) ret=retInfo;
  if(r.name!=="detail") retInfo=null;
  const view=$("#view");
  const oldNode=view.firstElementChild;
  const useStash=!!(ret&&stash&&stash.hash===location.hash&&stash.name===r.name);
  if(r.name==="detail"&&(prev==="home"||prev==="category")&&oldNode&&retInfo){
    stripIds(oldNode);
    stash={hash:retInfo.hash,name:prev,node:oldNode};
  }else if(r.name!=="detail"&&!useStash){
    stash=null;
  }
  const fx=fxOK();
  const heroIn=fx&&r.name==="detail"&&heroFrom&&Date.now()-heroFrom.t<1500?heroFrom:null;
  heroFrom=null;
  let back=null;
  if(fx&&ret&&ret.hero){
    const hero=$(".detail-hero");
    const him=hero&&hero.querySelector("img");
    if(him){
      const h=heroDesc(hero);
      if(h.top<window.innerHeight&&h.top+h.height>0&&h.height-h.clipT>h.height*.3){
        back={src:him.currentSrc||him.src,h,price:null};
        const price=$("#view .detail-price");
        if(price){
          const pr=price.getBoundingClientRect();
          const head=$("#view .page-head");
          const bar=$(".detail-bar");
          const hb=head?head.getBoundingClientRect().bottom:0;
          const bt=bar?bar.getBoundingClientRect().top:window.innerHeight;
          if(pr.top>=hb-1&&pr.top<bt-30) back.price=priceDesc(price);
        }
      }
    }
  }
  const toY=ret?ret.y:(keepScroll===true?y:0);
  const ghost=fx&&!FX_LITE&&(heroIn||ret)&&oldNode?makeGhost(oldNode,y,toY):null;
  if(ghost){fxOn();setTimeout(fxOff,FX_MS+900);}
  if(useStash){
    view.textContent="";
    restoreIds(stash.node);
    view.appendChild(stash.node);
    stash=null;
  }else{
    view.innerHTML=VIEWS[r.name](r.params);
  }
  const isDetail=r.name==="detail";
  $("#tabbar").classList.toggle("hide",isDetail);
  $("#fabBtn").classList.toggle("hide",isDetail);
  window.scrollTo(0,toY);
  skipFab=!!ret;
  fxBusyUntil=ghost?Date.now()+FX_MS+500:0;
  if(!useStash) bindViewEvents();
  if(!FX_LITE&&(heroIn||ghost)) requestAnimationFrame(()=>{
    if(heroIn) playHero(heroIn,ghost);
    else if(ghost) playBack(back,leftId,ghost);
  });
  if(needLogin) openLogin();
}

function getCouponStatus(id){
  const c=store.coupons.find(x=>x.id===id);
  const def=COUPONS.find(x=>x.id===id);
  if(!c||!def) return "none";
  if(c.status==="used"||c.status==="expired") return c.status;
  if(Date.now()-c.claimedAt>def.validDays*86400000){
    c.status="expired";c.expiredAt=Date.now();saveStore();
    return "expired";
  }
  return "active";
}

function bestCoupon(p,raw){
  let best=null;
  COUPONS.forEach(c=>{
    if(getCouponStatus(c.id)==="active"&&couponFits(c,p)&&raw>=c.need&&(!best||c.minus>best.minus)) best=c;
  });
  return best;
}
function recalcBuy(p){
  const qty=parseInt(($("#cfQty")&&$("#cfQty").textContent)||"1",10);
  const raw=p.price*qty;
  const c=bestCoupon(p,raw);
  const total=c?raw-c.minus:raw;
  $("#cfCoupon").innerHTML=c?'<span class="confirm-coupon">已使用「'+c.name+'」 -¥'+c.minus+'</span>':'<span style="color:var(--weak);font-weight:400">暂无可用优惠券</span>';
  $("#cfTotal").textContent="¥"+total;
  return {qty,total,coupon:c};
}

function syncOrders(){
  const now=Date.now();
  // 取消订单：每天凌晨0点后清空一次
  clearCancelledDaily(now);
  // 待支付订单：找出超时/超额的，删除前先查网关确认真未支付（防止误删已付款订单）
  const unpaid=store.orders.filter(o=>o.status==="unpaid").sort((a,b)=>b.ts-a.ts);
  unpaid.forEach((o,idx)=>{
    const expired=now-o.ts>UNPAID_TTL;
    const overflow=idx>=MAX_UNPAID;
    if(expired||overflow) confirmUnpaidThenRemove(o);
  });
  // 取消订单：只保留最近 MAX_CANCELLED 条，更早的直接清除
  const cancelled=store.orders.filter(o=>o.status==="cancelled").sort((a,b)=>(b.cancelAt||b.ts)-(a.cancelAt||a.ts));
  if(cancelled.length>MAX_CANCELLED){
    const keepC=new Set(cancelled.slice(0,MAX_CANCELLED).map(o=>o.no));
    store.orders=store.orders.filter(o=>{
      if(o.status==="cancelled"&&!keepC.has(o.no)) return false;
      return true;
    });
  }
  store.orders.forEach(o=>{
    if(o.status==="待接单") o.status="pending";
    if(o.status==="pending"&&now-(o.paidAt||o.ts)>15000) o.status="ongoing";
    if(o.status==="refunding"&&o.refundTs&&now-o.refundTs>8000) o.status="refunded";
  });
}
function clearCancelledDaily(now){
  const d=new Date(now);
  const clearAt=new Date(d.getFullYear(),d.getMonth(),d.getDate(),CANCEL_CLEAR_HOUR,0,0).getTime();
  if(now>=clearAt&&(store.cancelClearedAt||0)<clearAt){
    store.orders=store.orders.filter(o=>o.status!=="cancelled");
    store.cancelClearedAt=now;
    return true;
  }
  return false;
}
function confirmUnpaidThenRemove(o){
  if(o.status!=="unpaid") return;
  queryPaid(o.no).then(paid=>{
    if(paid){ if(o.status==="unpaid") markPaid(o); return; }   // 网关已支付→救回并保留
    const i=store.orders.findIndex(x=>x.no===o.no);
    if(i>=0){ store.orders.splice(i,1); releaseCoupon(o); saveStore(); if(parseHash().name==="orders") render(true); }
  }).catch(()=>{});   // 查询失败则不删除（保守，避免误删已付款订单）
}
function unpaidRateLimited(){
  const now=Date.now();
  const recent=store.orders.filter(o=>o.status==="unpaid"&&now-o.ts<=UNPAID_RATE_WINDOW).length;
  return recent>=UNPAID_RATE_LIMIT;
}

    Object.assign(store,{user:null,orders:[],coupons:[],favs:[]});

  "go-favs"(){if(!requireLogin()) go("#/favs");},

  "do-feedback"(){

  "order-filter"(el){

  "order-cancel"(el){

  },

    toast("评价成功，感谢你的反馈");
  },
  "order-refund"(el){openRefund(el.dataset.no);},
  "do-refund"(el){
    const o=findOrder(el.dataset.no);
    if(!o) return;
    o.status="refunding";o.refundTs=Date.now();o.refundReason=$("#rfReason").value;
    saveStore();closeSheet();render(true);
    toast("退款申请已提交，预计10分钟内原路退回");
  },

  "get-coupon"(el){
    if(requireLogin()) return;
    const id=el.dataset.id;
    if(store.coupons.some(x=>x.id===id)) return;
    store.coupons.push({id,claimedAt:Date.now(),status:"active",usedAt:null,expiredAt:null});
    saveStore();
    const box=$("#couponBox");
    if(box) box.innerHTML=couponBlock(productById(parseInt(box.dataset.id,10)));
    else render(true);
    toast("优惠券领取成功");
  },

  "sel-pay"(el){
    document.querySelectorAll(".pay-method").forEach(m=>m.classList.remove("selected"));
    el.classList.add("selected");
  },
  "qty-plus"(){stepQty(1);},
  "qty-minus"(){stepQty(-1);},
  "toggle-fav"(el){
    if(requireLogin()) return;
    const id=parseInt(el.dataset.id,10);
    const i=store.favs.indexOf(id);
    if(i>=0) store.favs.splice(i,1);else store.favs.push(id);
    saveStore();
    const on=i<0;
    el.classList.toggle("on",on);
    el.querySelector("svg").setAttribute("fill",on?"currentColor":"none");
    toast(on?"收藏成功":"已取消收藏",on);
  },
  "open-buy"(el){
    if(requireLogin()) return;
    openBuy(productById(parseInt(el.dataset.id,10)));
  },
  "cf-plus"(){stepCfQty(1);},
  "cf-minus"(){stepCfQty(-1);},
  "do-buy"(){
    const p=currentBuy;
    if(!p) return;
    syncOrders();
    if(unpaidRateLimited()){toast("下单太频繁，1分钟内最多创建3个待支付订单，请稍后再试",false);return;}
    const r=recalcBuy(p);
    const payType=($(".pay-method.selected")||{dataset:{}}).dataset.pay||"alipay";
    const no="XY"+String(Date.now()).slice(-8)+Math.floor(Math.random()*90+10);
    const order={
      no,id:p.id,title:p.title,img:p.img,gameName:gameById(p.game).name,
      price:p.price,qty:r.qty,unit:p.unit,server:$("#cfServer").value,note:($("#cfNote").value||"").trim(),
      total:r.total,ts:Date.now(),status:"unpaid",payType,couponId:r.coupon?r.coupon.id:null
    };
    if(r.coupon){
      const c=store.coupons.find(x=>x.id===r.coupon.id);
      c.status="used";c.usedAt=Date.now();c.orderNo=no;
    }
    store.orders.push(order);
    saveStore();closeSheet();
    startPayment(no,p.title,r.total,payType);
  }
};
function stepQty(d){
  const n=$("#qtyNum");
  const v=Math.min(20,Math.max(1,parseInt(n.textContent,10)+d));
  n.textContent=v;
  $("#qtyMinus").disabled=v<=1;
}
function stepCfQty(d){
  if(!currentBuy) return;
  const n=$("#cfQty");
  n.textContent=Math.min(20,Math.max(1,parseInt(n.textContent,10)+d));
  recalcBuy(currentBuy);
}

  if(ACTIONS[action]) ACTIONS[action](el,e);
});

function binl2rstr(input){var i,output='',length32=input.length*32;for(i=0;i<length32;i+=8)output+=String.fromCharCode((input[i>>5]>>>i%32)&0xff);return output;}
function rstr2binl(input){var i,output=[];output[(input.length>>2)-1]=undefined;for(i=0;i<output.length;i+=1)output[i]=0;var length8=input.length*8;for(i=0;i<length8;i+=8)output[i>>5]|=(input.charCodeAt(i/8)&0xff)<<i%32;return output;}

function rstr2hex(input){var hexTab='0123456789abcdef',output='',x,i;for(i=0;i<input.length;i+=1){x=input.charCodeAt(i);output+=hexTab.charAt((x>>>4)&0x0f)+hexTab.charAt(x&0x0f);}return output;}
function md5(string){return rstr2hex(rstrMD5(unescape(encodeURIComponent(string))));}

function paySign(params,key){
  const str=Object.keys(params).sort().filter(k=>k!=="sign"&&k!=="sign_type"&&params[k]!==""&&params[k]!=null).map(k=>k+"="+params[k]).join("&");
  return md5(str+key).toLowerCase();
}
function startPayment(orderNo,name,money,payType){
  const ov=document.createElement("div");
  ov.className="pay-loading-overlay";
  ov.innerHTML='<div class="pl-spinner"></div><div class="pl-text">正在跳转到收银台…</div><div class="pl-sub">请稍候，正在安全连接支付网关</div>';
  document.body.appendChild(ov);
  const params={
    pid:PAY_CONFIG.pid,type:payType||"alipay",out_trade_no:orderNo,notify_url:PAY_CONFIG.notifyUrl,
    return_url:"https://88sss.top/?trade_status=TRADE_SUCCESS&out_trade_no="+orderNo,
    name,money:money.toFixed(2)
  };
  params.sign=paySign(params,PAY_CONFIG.key);
  params.sign_type="MD5";
  const payUrl=PAY_CONFIG.gateway+"?"+new URLSearchParams(params).toString();
  setTimeout(()=>{location.href=payUrl;},50);
}
function removePayOverlay(){
  const ov=$(".pay-loading-overlay");
  if(ov) ov.remove();
}
window.addEventListener("pageshow",removePayOverlay);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible") removePayOverlay();});

function queryPaid(no){
  const url=PAY_CONFIG.queryApi+"?out_trade_no="+encodeURIComponent(no);
  return fetch(url).then(r=>r.json()).then(d=>{
    if(!d) return false;
    const st=String(d.status==null?"":d.status).toLowerCase();
    if(st==="1"||st==="paid"||st==="success"||st==="true") return true;   // 兼容网关返回 status 为字符串 "1"
    if(d.trade_status==="TRADE_SUCCESS") return true;                      // 官方易支付
    if(String(d.code)==="1"&&st==="1") return true;
    return false;
  }).catch(()=>false);
}
function markPaid(o,forceJump){
  o.status="pending";o.paidAt=Date.now();
  saveStore();
  toast("支付成功！订单已提交");
  if(!forceJump&&parseHash().name==="orders") render(true);
  else setTimeout(()=>go("#/orders?f=pending"),800);
}
function pollUnpaidOrders(){
  store.orders.filter(o=>o.status==="unpaid").forEach(o=>{
    queryPaid(o.no).then(paid=>{if(paid&&o.status==="unpaid") markPaid(o);});
  });
}
function verifyPayReturn(no,successFlag){
  const o=findOrder(no);
  if(!o) return;
  if(o.status!=="unpaid"){go("#/orders?f=pending");return;}
  if(successFlag){markPaid(o,true);return;}
  queryPaid(no).then(paid=>{
    if(paid){markPaid(o,true);return;}
    toast("正在确认支付结果，请稍候…",false);
    go("#/orders?f=unpaid");
  });
}

const genUserId=uid=>{
  let h=0;
  for(let i=0;i<uid.length;i++) h=((h<<5)-h+uid.charCodeAt(i))|0;
  return "XY"+String(Math.abs(h)%900000+100000);
};
function processAzeLogin(d){
  if(!(d.code===0&&d.social_uid)){toast("登录失败："+(d.msg||"未知错误"),false);return;}
  const nick=(d.nickname||"用户"+String(d.social_uid).slice(-4)).slice(0,12);
  let avatar=String(d.faceimg||"").replace(/^http:/,"https:");
  if(!/^https:\/\//.test(avatar)) avatar="";
  const labels={qq:"QQ",wx:"微信",alipay:"支付宝",sina:"微博",baidu:"百度",douyin:"抖音",huawei:"华为",xiaomi:"小米",google:"Google",microsoft:"微软",dingtalk:"钉钉",feishu:"飞书",gitee:"Gitee",github:"GitHub"};
  const label=labels[d.type]||"账号";
  const uid=genUserId(String(d.social_uid));
  const saved=loadUserData(uid)||{};
  store.orders=saved.orders||[];
  store.coupons=saved.coupons||[];
  store.favs=saved.favs||[];
  dedupeCoupons();
  store.user={name:nick,contact:label,uid,aze:{uid:d.social_uid,avatar,type:d.type},loginAt:Date.now()};
  saveStore();
  toast(label+"登录成功，欢迎来到星柚电竞");
  go("#/profile");
}
function azeCallback(code,type){
  toast("登录中…");
  const url=AZE_CONFIG.proxy+"?act=callback&appid="+AZE_CONFIG.appid+"&appkey="+AZE_CONFIG.appkey+"&type="+encodeURIComponent(type)+"&code="+encodeURIComponent(code);
  fetch(url,{mode:"cors"}).then(r=>r.json()).then(processAzeLogin).catch(()=>toast("网络异常，请重试",false));
}
function azeReturn(raw){
  try{
    let s=raw.replace(/ /g,"+").replace(/-/g,"+").replace(/_/g,"/");
    while(s.length%4) s+="=";
    const bin=atob(s);
    let pct="";
    for(let i=0;i<bin.length;i++) pct+="%"+("00"+bin.charCodeAt(i).toString(16)).slice(-2);
    processAzeLogin(JSON.parse(decodeURIComponent(pct)));
  }catch(e){toast("登录数据解析失败",false);}
}
function handleUrlParams(){
  const q=Object.fromEntries(new URLSearchParams(location.search));
  const isPay=q.out_trade_no;
  const isCallback=q.code&&q.type;
  const isReturn=q.aze_login==="1"&&q.u;
  if(!(isPay||isCallback||isReturn)) return;
  history.replaceState(null,"",location.pathname+location.hash);
  if(isPay) verifyPayReturn(q.out_trade_no,q.trade_status==="TRADE_SUCCESS");
  else if(isCallback) azeCallback(q.code,q.type);
  else azeReturn(q.u);
}

function initPromo(){
  const box=$("#promoBox"),img=$("#promoImg");
  if(!box) return;
  let seen=false;
  try{seen=!!sessionStorage.getItem("xy_promo_seen");}catch(e){}
  if(seen){box.remove();return;}
  const close=()=>{box.classList.remove("show");setTimeout(()=>box.remove(),300);};
  img.onload=()=>{
    try{sessionStorage.setItem("xy_promo_seen","1");}catch(e){}
    setTimeout(()=>box.classList.add("show"),380);
  };
  img.onerror=()=>box.remove();
  img.src=["pop1.webp","pop2.webp"][Math.floor(Math.random()*2)];
  $("#promoClose").addEventListener("click",close);
  box.addEventListener("click",e=>{if(e.target===box) close();});
}

try{history.scrollRestoration="manual";}catch(e){}
setTimeout(()=>{
  const seen={};
  window._warmImgs=[];
  PRODUCTS.forEach(p=>{
    if(seen[p.img]) return;
    seen[p.img]=1;
    const im=new Image();
    im.src=p.img;
    if(im.decode) im.decode().catch(()=>{});
    window._warmImgs.push(im);
  });
},1200);
if(!location.hash) location.hash="#/home";
if(store.noticeClosed) $("#noticeBar").classList.add("hide");
render();
handleUrlParams();
setTimeout(pollUnpaidOrders,2000);
setInterval(pollUnpaidOrders,10000);
setInterval(()=>{
  if(parseHash().name!=="orders"||$(".mask")) return;
  const before=store.orders.map(o=>o.status).join();
  syncOrders();
  if(store.orders.map(o=>o.status).join()!==before){saveStore();render(true);}
},4000);
initPromo();
</script>
<script>
(function(){
  var MAX=50,RANGE=160,EASE=0.15,SPLIT=0.6;
  var cur=0,target=0,raf=0;
  function calc(){
    var y=window.pageYOffset||document.documentElement.scrollTop||document.body.scrollTop||0;
    return MAX*Math.min(1,Math.max(0,y/RANGE));
  }
  function apply(v){
    var c=document.getElementById("homeFollow");
    var g=document.querySelector(".home-games");
    if(!c||!g) return;
    var up=v*SPLIT,down=v-up;
    c.style.transform="translate3d(0,"+(-up).toFixed(2)+"px,0)";
    c.style.marginBottom=(-up).toFixed(2)+"px";
    g.style.transform="translate3d(0,"+down.toFixed(2)+"px,0)";
  }
  function tick(){
    raf=0;
    var d=target-cur;
    if(Math.abs(d)<0.05){cur=target;apply(cur);return;}
    cur+=d*EASE;
    apply(cur);
    raf=requestAnimationFrame(tick);
  }
  function onScroll(){
    target=calc();
    if(!raf) raf=requestAnimationFrame(tick);
  }
  function sync(){
    target=calc();
    cur=target;
    apply(cur);
  }
  window.addEventListener("scroll",onScroll,{passive:true});
  document.addEventListener("scroll",onScroll,{passive:true,capture:true});
  window.addEventListener("touchmove",onScroll,{passive:true});
  window.addEventListener("resize",sync);
  new MutationObserver(sync).observe(document.getElementById("view"),{childList:true});
  sync();
})();
</script>
