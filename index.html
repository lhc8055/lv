<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>星柚电竞 · 游戏陪玩开黑</title><link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=ZCOOL+KuaiLe&display=swap"><style>/* ============================================================ 星柚电竞 · 陪玩移动端原型 ============================================================ */:root{ --pri:#5b6cf0; --pri-deep:#4453d6; --pri-soft:#eef0ff; --purple:#8a63ff; --pink:#ff7ab8; --cyan:#46c8ff; --ink:#22264b; --sub:#8b90b2; --weak:#b3b8d6; --bg:#f3f5fc; --card:#ffffff; --line:#eceef8; --red:#ff4d4f; --gold:#ffb53d; --radius:18px; --shadow:0 8px 24px rgba(84,99,220,.10); --shadow-sm:0 4px 12px rgba(84,99,220,.08); --tab-h:54px; --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; --font-cute:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}html,body{height:100%;}body{ font-family:var(--font-body); color:var(--ink); background: radial-gradient(620px 380px at 12% -6%, rgba(138,99,255,.20), transparent 60%), radial-gradient(620px 380px at 100% 0%, rgba(70,200,255,.18), transparent 55%), #dfe5f7; -webkit-font-smoothing:antialiased;}button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}input,select,textarea{font-family:inherit;outline:none;border:none;background:none;color:inherit;}img{display:block;}ul{list-style:none;}a{color:inherit;text-decoration:none;}
/* ---------- 手机容器 ---------- */#app{ position:relative; width:100%; max-width:460px; min-height:100vh; margin:0 auto; background:var(--bg); box-shadow:0 0 60px rgba(70,80,160,.18); padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); overflow:hidden;}.view{display:none;}.view.active{display:block;}@keyframes fade{from{opacity:0;}to{opacity:1;}}
/* ---------- 顶部优惠条 ---------- */.notice{ display:flex;align-items:center;gap:8px; padding:9px 14px; background:linear-gradient(90deg,#fff7e0,#fff2d2); color:#e2492d;font-size:12.5px;font-weight:500;line-height:1.4;}.notice svg{flex:none;width:15px;height:15px;}.notice .n-close{margin-left:auto;flex:none;width:22px;height:22px;border-radius:50%; display:flex;align-items:center;justify-content:center;color:#d8906f;font-size:15px;}.notice.hide{display:none;}
/* ---------- 通用 ---------- */.section{padding:0 14px;}.section-title{display:flex;align-items:center;gap:8px;margin:18px 2px 11px;font-size:16px;font-weight:700;}.section-title .more{margin-left:auto;font-size:12px;color:var(--sub);font-weight:400;display:flex;align-items:center;gap:2px;}
.searchbar{ display:flex;align-items:center;gap:9px; margin:12px 14px;padding:0 14px;height:36px; background:#ffffff;border-radius:18px; border:1.5px solid #2563eb;transition:border-color .15s;}.searchbar:focus-within{border-color:#2563eb;}.searchbar svg{width:18px;height:18px;flex:none;color:#9ca3af;}.searchbar input{flex:1;font-size:14px;letter-spacing:.3px;color:var(--ink);min-width:0;padding-left:4px;}.searchbar input::placeholder{color:#9ca3af;}
/* ---------- 首页 Banner ---------- */.banner{ position:relative;margin:4px 14px 0;border-radius:20px;overflow:hidden; box-shadow:var(--shadow);aspect-ratio:2048/896;background:#dbe4ff;}.banner img{width:100%;height:100%;object-fit:cover;}.banner .b-text{position:absolute;top:0;right:0;width:54%;height:100%; display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 12px 0 0;}.banner .b-name{font-family:var(--font-cute);font-size:30px;line-height:1.1;color:#fff; letter-spacing:2px; text-shadow:-1.5px -1.5px 0 #7d8cff,1.5px -1.5px 0 #7d8cff,-1.5px 1.5px 0 #7d8cff,1.5px 1.5px 0 #7d8cff, 0 3px 0 #6472ec,0 6px 12px rgba(90,104,230,.35);}.banner .b-sub{margin-top:13px;font-size:10.5px;color:#4a53b0;font-weight:700;line-height:1.9; background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.95); padding:7px 11px;border-radius:11px;box-shadow:0 3px 8px rgba(110,123,255,.18);}
/* ---------- 双入口卡 ---------- */.quick{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:13px 14px 22px;}.quick-card{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1536/1024; box-shadow:var(--shadow-sm);transition:transform .12s;}.quick-card:active{transform:scale(.97);}.quick-card img{width:100%;height:100%;object-fit:cover;}.quick-card .q-center{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;}.quick-card.hot .q-center{left:47%;right:5%;}.quick-card.all .q-center{left:5%;right:50%;}.quick-card .q-title{font-family:var(--font-cute);font-size:18px;letter-spacing:1px; color:#ff5d9e;text-shadow:0 2px 0 #fff,0 2px 6px rgba(255,255,255,.9);}.quick-card .q-btn{margin-top:2px;font-size:10.5px;font-weight:600;padding:4px 13px;border-radius:12px;}.quick-card.hot .q-btn{color:#e07a5f;background:rgba(255,218,193,.85);}.quick-card.all .q-btn{color:#5b8c85;background:rgba(181,234,215,.85);}
/* ---------- 游戏入口 ---------- */.games{display:flex;align-items:flex-start;gap:18px;padding:14px 16px 10px;flex-wrap:nowrap;overflow-x:auto;}.game{display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s;flex:none;}.game:active{transform:scale(.94);}.gicon{width:58px;height:58px;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.1);position:relative;}.gicon img{width:100%;height:100%;object-fit:cover;}.gicon.dark{background:#15131c;}.gicon.dark img{width:63%;height:63%;object-fit:contain;}.gicon.wz{background:linear-gradient(150deg,#202c66,#3a2370);}.gicon.wz img{width:80%;height:80%;object-fit:contain;}.gicon.all{background:linear-gradient(150deg,#dfe6ff,#cfd8ff);}.gicon.all svg{width:27px;height:27px;color:var(--pri);}.gname{font-size:12px;font-weight:500;color:#9ca3af;}/* 选中渐变光环 */.game.on .gicon{box-shadow:0 4px 16px rgba(139,92,246,.45);}.game.on .gicon::before{content:"";position:absolute;inset:-4px;border-radius:18px; padding:4px;background:linear-gradient(135deg,#ddd6fe 0%,#a78bfa 25%,#8b5cf6 55%,#6d28d9 80%,#5b21b6 100%); -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0); -webkit-mask-composite:xor;mask-composite:exclude; pointer-events:none;}.game.on .gname{color:#7c3aed;font-weight:700;}.home-games{padding:18px 16px 14px;gap:20px;}.home-games .game{width:68px;}.home-games .gicon{width:52px;height:52px;border-radius:13px;}.home-games .game.on .gicon::before{inset:-4px;border-radius:17px;padding:4px;}.home-games .gname{font-size:11.5px;white-space:nowrap;}
/* ---------- 首页商品双列 ---------- */.no-more{text-align:center;color:#999;font-size:12px;padding:20px 0 6px;}.no-more:before,.no-more:after{content:"";display:inline-block;width:20px;height:1px;background:#e0e0e0;vertical-align:middle;margin:0 8px;}.goods-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:0 14px;}.gcard{background:var(--card);border-radius:15px;overflow:hidden;box-shadow:var(--shadow-sm); transition:transform .12s;display:block;}.gcard:active{transform:scale(.97);}.gcard .g-img{position:relative;width:100%;aspect-ratio:1/1;background:#e3e9ff;}.gcard .g-img img{width:100%;height:100%;object-fit:cover;}.gcard .g-tag{position:absolute;left:7px;top:7px;font-size:9.5px;color:#fff; background:linear-gradient(135deg,rgba(255,93,126,.92),rgba(255,138,92,.92)); padding:2.5px 7px;border-radius:9px;font-weight:500;}.gcard .g-body{padding:8px 9px 10px;}.gcard .g-title{font-size:12.5px;font-weight:700;line-height:1.35;height:34px; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}.gcard .g-foot{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px;}.gcard .g-price{color:var(--red);font-weight:900;font-size:16px;}.gcard .g-price small{font-size:10px;font-weight:500;}.gcard .g-heat{font-size:10px;color:var(--weak);display:flex;align-items:center;gap:2px;}.gcard .g-heat svg{width:10px;height:10px;}

/* 分类页样式（新版） */
.cat-game-row{display:flex;align-items:flex-start;padding:16px 12px 14px;overflow-x:auto;}
.cat-game-row .game{width:81px;gap:9px;}
.cat-game-row .gicon{width:48px;height:48px;border-radius:12px;}
.cat-game-row .game.on .gicon::before{inset:-4px;border-radius:16px;padding:4px;}
.cat-game-row .gname{font-size:12.5px;color:#4b5068;}
.cat-game-row .game.on .gname{color:#7c3aed;font-weight:800;}
.cat-wrap{display:flex;align-items:flex-start;gap:11px;padding:0 10px 14px;}
.cat-side{flex:none;width:100px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);}
.cat-side .zone{display:block;width:100%;text-align:left;padding:14px 16px;font-size:12px;line-height:1.3;color:#9a9eb5;background:#fff;transition:background .15s;}
.cat-side .zone.on{background:#f4f5fa;color:var(--ink);font-weight:800;}
.cat-main{flex:1;min-width:0;background:#fff;border-radius:16px;box-shadow:var(--shadow-sm);min-height:340px;padding-bottom:8px;}
.sortbar{display:flex;align-items:center;justify-content:center;gap:16px;height:44px;margin:0 8px;
  border-bottom:1px solid #eeeff5;font-size:13px;color:#9a9ab0;}
.sortbar .sort{display:flex;align-items:center;gap:4px;padding:6px 2px;color:#9a9ab0;}
.sortbar .sort.on{color:var(--ink);font-weight:800;}
.sort-arrows{display:inline-flex;flex-direction:column;gap:2px;}
.sort-arrows i{display:block;width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;}
.sort-arrows i.up{border-bottom:4.5px solid #c9cde0;}
.sort-arrows i.down{border-top:4.5px solid #c9cde0;}
.sort-arrows i.up.on{border-bottom-color:#7c3aed;}
.sort-arrows i.down.on{border-top-color:#7c3aed;}
.cat-list{padding-top:6px;}
.grow{display:flex;gap:13px;width:100%;text-align:left;background:none;padding:14px 16px 14px 18px;transition:background .12s;}
.grow:active{background:#f7f8fd;}
.grow .gr-img{flex:none;width:75px;height:75px;border-radius:6px;overflow:hidden;background:#e3e9ff;}
.grow .gr-img img{width:100%;height:100%;object-fit:cover;}
.grow .gr-body{flex:1;min-width:0;min-height:75px;display:flex;flex-direction:column;justify-content:space-between;}
.grow .gr-title{font-size:14px;font-weight:800;line-height:1.35;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.grow .gr-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;}
.grow .gr-price{color:var(--red);font-weight:800;font-size:17px;line-height:1;white-space:nowrap;}
.grow .gr-price small{font-size:11px;font-weight:500;}
.grow .gr-heat{font-size:12px;color:#a3a6b8;white-space:nowrap;line-height:1;}

/* ============================================================ 我的 ============================================================ */.profile-head{padding:30px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:11px;}.avatar{width:82px;height:82px;border-radius:50%;overflow:hidden;border:3px solid #fff; box-shadow:0 8px 20px rgba(91,108,240,.25);background:#dfe6ff;position:relative;}.avatar img{width:100%;height:100%;object-fit:cover;}.avatar .login-mask{position:absolute;inset:0;background:rgba(34,38,75,.42);color:#fff;font-size:11px; display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;}.pname{font-size:18px;font-weight:700;}.pname .p-login{font-size:12.5px;color:var(--pri);font-weight:500;margin-left:8px; border:1px solid var(--pri);padding:2px 10px;border-radius:11px;}.p-stats{display:flex;width:100%;background:#fff;border-radius:16px;box-shadow:var(--shadow-sm); padding:14px 0;margin-top:6px;}.p-stats .st{flex:1;text-align:center;position:relative;}.p-stats .st + .st::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%); width:1px;height:24px;background:var(--line);}.p-stats .st b{display:block;font-size:19px;font-weight:800;color:var(--ink);}.p-stats .st span{font-size:11.5px;color:var(--sub);}.func-card{margin:6px 14px 0;background:#fff;border-radius:18px;box-shadow:var(--shadow-sm); padding:6px 4px;}.func-row{display:flex;align-items:center;gap:13px;padding:15px 14px;border-radius:13px;min-height:52px;}.func-row:active{background:#f6f7ff;}.func-ico{flex:none;width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center; color:#fff;box-shadow:var(--shadow-sm);}.func-ico svg{width:22px;height:22px;}.func-ico.blue{background:linear-gradient(140deg,#4facfe,#3b82f6);}.func-ico.gold{background:linear-gradient(140deg,#ffd76a,#ffb02e);}.func-ico.orange{background:linear-gradient(140deg,#ffa45e,#ff6a3d);}.func-ico.purple{background:linear-gradient(140deg,#a78bff,#7a5cff);}.func-ico.pink{background:linear-gradient(140deg,#ff9ecb,#ff6fa5);}.func-name{font-size:14.5px;font-weight:500;}.func-row .arrow{margin-left:auto;color:#c6cbe6;}.func-row .arrow svg{width:17px;height:17px;}.func-tip{margin:18px 0 4px;text-align:center;font-size:12.5px;color:var(--weak);}.service-note{margin:16px 24px 0;padding:13px 15px;background:#f0f2ff;border-radius:14px; font-size:11.5px;color:#7b81a8;line-height:1.7;}.service-note b{color:var(--pri);}
/* ---------- 我的：简洁版 ---------- */.pf-header{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:40px 20px 24px;text-align:center;background:var(--bg);border:none;cursor:pointer;}.pf-header:active{opacity:.8;}.pf-avatar{width:88px;height:88px;border-radius:50%;overflow:hidden;margin:0 auto 14px;box-shadow:0 6px 20px rgba(91,108,240,.18);border:3px solid #fff;}.pf-avatar img{width:100%;height:100%;object-fit:cover;}.pf-name{font-size:20px;font-weight:800;color:var(--ink);}.pf-id{font-size:13px;color:var(--sub);margin-top:4px;}.pf-avatar{position:relative;}.pf-avatar-off img{filter:brightness(.6);}.pf-avatar-mask{position:absolute;inset:0;border-radius:50%;background:rgba(100,110,130,.25);}.pf-section{padding:0 16px;}.pf-sec-title{font-size:15px;font-weight:700;color:var(--ink);margin:8px 4px 12px;}.pf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 4px;background:#fff;border-radius:18px;padding:18px 10px;box-shadow:var(--shadow-sm);}.pf-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;}.pf-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.08);}.pf-ico svg{width:22px;height:22px;}.pf-ico.f-blue{background:linear-gradient(135deg,#60a5fa,#3b82f6);}.pf-ico.f-yellow{background:linear-gradient(135deg,#ffe17a 0%,#ffb02e 50%,#ff9500 100%);box-shadow:0 3px 12px rgba(255,176,46,.35);}.pf-ico.f-pink{background:linear-gradient(135deg,#f9a8d4,#ec4899);}.pf-ico.f-orange{background:linear-gradient(135deg,#fb923c,#f97316);}.pf-ico.f-purple{background:linear-gradient(135deg,#a78bfa,#8b5cf6);}.pf-ico.f-gray{background:linear-gradient(135deg,#9ca3af,#6b7280);}.pf-label{font-size:11.5px;color:#555b85;font-weight:500;}.pf-badge{position:absolute;top:-2px;right:calc(50% - 30px);min-width:18px;height:18px;border-radius:9px;background:#ff4d4f;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700;}/* ---------- 我的：会员卡 ---------- */.member-card{position:relative;overflow:hidden;margin:14px;padding:18px 16px;border-radius:20px;min-height:96px; background:linear-gradient(125deg,#0a1929 0%,#162d50 48%,#1e4a7a 100%);color:#fff; display:flex;align-items:center;gap:13px;box-shadow:0 12px 26px rgba(10,25,41,.38);}.member-card::before{content:"";position:absolute;right:-34px;top:-46px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.06);}.member-card::after{content:"";position:absolute;right:26px;bottom:-56px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.05);}.mc-avatar{position:relative;flex:none;width:60px;height:60px;border-radius:50%;overflow:hidden; border:2.5px solid rgba(255,255,255,.85);box-shadow:0 6px 14px rgba(10,25,41,.35);z-index:1;background:#dfe6ff;}.mc-avatar img{width:100%;height:100%;object-fit:cover;}.mc-avatar .m{position:absolute;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}.mc-info{flex:1;min-width:0;z-index:1;}.mc-name{font-size:17px;font-weight:800;display:flex;align-items:center;gap:7px;}.mc-vip{font-size:9.5px;font-weight:700;background:linear-gradient(135deg,#ffe38a,#ffb53d);color:#8a5a00;padding:1.5px 7px;border-radius:8px;white-space:nowrap;flex:none;}.mc-sub{font-size:11px;opacity:.85;margin-top:5px;}.mc-go{z-index:1;flex:none;font-size:11px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);padding:6px 11px;border-radius:14px;white-space:nowrap;}/* ---------- 我的：通用白卡 ---------- */.p-card{margin:12px 14px 0;background:#fff;border-radius:18px;box-shadow:var(--shadow-sm);padding:13px 6px 9px;}.pc-head{display:flex;align-items:center;font-size:15px;font-weight:800;padding:0 10px 11px;}.pc-head .pc-more{margin-left:auto;font-size:11.5px;color:var(--sub);font-weight:400;display:flex;align-items:center;gap:2px;}/* 订单状态四宫格 */.order-quick{display:grid;grid-template-columns:repeat(4,1fr);}.oq{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0 7px;font-size:11.5px;color:#555b85;}.oq .oq-ico{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;}.oq .oq-ico svg{width:22px;height:22px;}.oq-ico.c1{background:#eef1ff;color:#5b6cf0;}.oq-ico.c2{background:#e6f9f0;color:#12b779;}.oq-ico.c3{background:#fff3e6;color:#ff8a2e;}.oq-ico.c4{background:#ffeef2;color:#ff5d7e;}.oq .dot{position:absolute;top:-1px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px; background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}/* 常用功能宫格 */.func-grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:15px;padding:3px 0 8px;}.fg{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:#555b85;position:relative;}.fg .fg-ico{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff; box-shadow:0 5px 11px rgba(90,100,200,.18);}.fg .fg-ico svg{width:22px;height:22px;}.fg .dot{position:absolute;top:-4px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px; background:var(--red);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}.fg-ico.f-yellow{background:linear-gradient(140deg,#ffd76a,#ffb02e);}.fg-ico.f-pink{background:linear-gradient(140deg,#ff9ecb,#ff6fa5);}.fg-ico.f-orange{background:linear-gradient(140deg,#ffb05e,#ff7a3d);}.fg-ico.f-blue{background:linear-gradient(140deg,#5ab0ff,#3b82f6);}.fg-ico.f-purple{background:linear-gradient(140deg,#a78bff,#7a5cff);}.fg-ico.f-red{background:linear-gradient(140deg,#ff8a8a,#ff5d7e);}.fg-ico.f-cyan{background:linear-gradient(140deg,#56d6e0,#3b9fd6);}.fg-ico.f-gray{background:linear-gradient(140deg,#aeb
