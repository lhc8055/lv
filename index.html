<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#667eea">
<title>飞云商城 - 虚拟商品自动发货</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:16px}
.container{max-width:900px;margin:0 auto}
.header{text-align:center;color:#fff;padding:30px 0 20px}
.header h1{font-size:28px;margin-bottom:6px}
.header p{opacity:.85;font-size:13px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:16px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.12);transition:transform .2s}
.card:active{transform:scale(.97)}
.card-icon{height:100px;display:flex;align-items:center;justify-content:center;font-size:48px;background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%)}
.card-body{padding:12px}
.card-title{font-size:15px;font-weight:600;color:#333;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-desc{font-size:12px;color:#888;margin-bottom:10px;line-height:1.4;height:34px;overflow:hidden}
.card-footer{display:flex;justify-content:space-between;align-items:center}
.price{font-size:18px;font-weight:700;color:#ff4757}
.price span{font-size:12px;font-weight:400}
.buy-btn{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;padding:6px 14px;border-radius:16px;font-size:12px;cursor:pointer}
.footer{text-align:center;color:rgba(255,255,255,.6);padding:30px 0 16px;font-size:11px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:360px;padding:24px;text-align:center;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h3{font-size:18px;margin-bottom:6px;color:#333}
.modal .product-name{color:#888;margin-bottom:16px;font-size:14px}
.modal .amount{font-size:32px;font-weight:700;color:#ff4757;margin:12px 0}
.modal .amount span{font-size:16px}
.pay-row{display:flex;gap:10px;margin-top:16px}
.pay-btn{flex:1;color:#fff;border:none;padding:12px;border-radius:10px;font-size:14px;cursor:pointer;font-weight:500}
.pay-btn.alipay{background:linear-gradient(135deg,#1677ff,#0958d9)}
.pay-btn.wxpay{background:linear-gradient(135deg,#07c160,#06ad56)}
.pay-btn:active{opacity:.85}
.close-btn{margin-top:14px;background:none;border:none;color:#999;cursor:pointer;font-size:13px}
.qr-box{padding:20px 0}
.qr-img{width:200px;height:200px;background:#f5f5f5;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.qr-img img{width:100%;height:100%;border-radius:12px}
.qr-tip{font-size:13px;color:#666;margin-bottom:8px}
.qr-timer{font-size:12px;color:#999}
.loading{display:inline-block;width:24px;height:24px;border:2px solid #f3f3f3;border-top:2px solid #667eea;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.big-loading{width:40px;height:40px;border-width:3px;margin:20px 0}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🚀 飞云商城</h1>
    <p>虚拟商品 · 自动发货 · 24小时在线</p>
  </div>
  <div class="products" id="productList">
    <div style="grid-column:1/-1;text-align:center;color:#fff;padding:30px;">
      <div class="loading big-loading"></div>
      <p style="margin-top:8px;font-size:13px;opacity:.8;">加载中...</p>
    </div>
  </div>
  <div class="footer">飞云商城 · 支付成功自动发货</div>
</div>

<!-- 支付方式选择弹窗 -->
<div class="modal-overlay" id="payModal">
  <div class="modal">
    <h3>选择支付方式</h3>
    <p class="product-name" id="modalProductName">-</p>
    <div class="amount"><span>¥</span><span id="modalPrice">0.00</span></div>
    <div class="pay-row">
      <button class="pay-btn alipay" onclick="goPay('alipay')">💰 支付宝</button>
      <button class="pay-btn wxpay" onclick="goPay('wxpay')">💬 微信支付</button>
    </div>
    <button class="close-btn" onclick="closeModal()">取消</button>
  </div>
</div>

<!-- 微信二维码弹窗 -->
<div class="modal-overlay" id="qrModal">
  <div class="modal">
    <h3>微信扫码支付</h3>
    <p class="product-name" id="qrProductName">-</p>
    <div class="amount"><span>¥</span><span id="qrPrice">0.00</span></div>
    <div class="qr-box">
      <div class="qr-img" id="qrImg">
        <div class="loading big-loading"></div>
      </div>
      <p class="qr-tip">请使用微信扫描二维码完成支付</p>
      <p class="qr-timer" id="qrTimer">正在等待支付...</p>
    </div>
    <button class="close-btn" onclick="closeQr()">取消支付</button>
  </div>
</div>

<script>
const API_BASE = '/api';
let currentProduct = null;
let currentOrderId = null;
let pollTimer = null;
let pollCount = 0;

async function loadProducts() {
  try {
    const res = await fetch(API_BASE + '/products', {cache:'force-cache'});
    const data = await res.json();
    renderProducts(data.products);
  } catch(e) {
    document.getElementById('productList').innerHTML = 
      '<div style="grid-column:1/-1;text-align:center;color:#fff;padding:30px;font-size:14px;">加载失败，请刷新重试</div>';
  }
}

function renderProducts(products) {
  const list = document.getElementById('productList');
  list.innerHTML = products.map(p => `
    <div class="card" onclick="buyProduct('${p.id}')">
      <div class="card-icon">${p.icon}</div>
      <div class="card-body">
        <div class="card-title">${p.name}</div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-footer">
          <div class="price"><span>¥</span>${p.price}</div>
          <button class="buy-btn">购买</button>
        </div>
      </div>
    </div>
  `).join('');
}

async function buyProduct(id) {
  const cached = window.__products;
  if (cached) {
    openPayModal(cached.find(p => p.id === id));
  } else {
    try {
      const res = await fetch(API_BASE + '/products', {cache:'force-cache'});
      const data = await res.json();
      window.__products = data.products;
      openPayModal(data.products.find(p => p.id === id));
    } catch(e) {}
  }
}

function openPayModal(product) {
  if (!product) return;
  currentProduct = product;
  document.getElementById('modalProductName').textContent = product.name;
  document.getElementById('modalPrice').textContent = product.price;
  document.getElementById('payModal').classList.add('active');
}

function closeModal() {
  document.getElementById('payModal').classList.remove('active');
}

async function goPay(payType) {
  if (!currentProduct) return;
  closeModal();
  
  try {
    const res = await fetch(API_BASE + '/create', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({productId: currentProduct.id, payType})
    });
    const data = await res.json();
    
    if (data.success && data.payUrl) {
      if (payType === 'wxpay') {
        showQrCode(data.orderId, data.payUrl);
      } else {
        window.location.href = data.payUrl;
      }
    } else {
      alert('创建订单失败: ' + (data.error || '未知错误'));
    }
  } catch(e) {
    alert('网络错误: ' + e.message);
  }
}

function showQrCode(orderId, payUrl) {
  currentOrderId = orderId;
  pollCount = 0;
  
  document.getElementById('qrProductName').textContent = currentProduct.name;
  document.getElementById('qrPrice').textContent = currentProduct.price;
  document.getElementById('qrImg').innerHTML = '<div class="loading big-loading"></div>';
  document.getElementById('qrTimer').textContent = '正在获取二维码...';
  document.getElementById('qrModal').classList.add('active');
  
  // 用 iframe 加载支付页面，提取二维码
  fetchQrCode(payUrl);
  
  // 开始轮询支付状态
  startPolling(orderId);
}

async function fetchQrCode(payUrl) {
  try {
    // 通过我们的代理获取二维码
    const res = await fetch(API_BASE + '/qrcode?url=' + encodeURIComponent(payUrl));
    const data = await res.json();
    if (data.success && data.qrCode) {
      document.getElementById('qrImg').innerHTML = 
        '<img src="' + data.qrCode + '" alt="支付二维码" />';
    } else {
      // 失败了就显示跳转链接
      document.getElementById('qrImg').innerHTML = 
        '<div style="text-align:center;padding:20px;font-size:13px;color:#666;">获取失败<br><a href="' + payUrl + '" style="color:#667eea;text-decoration:underline;" target="_blank">点此打开支付页</a></div>';
    }
  } catch(e) {
    document.getElementById('qrImg').innerHTML = 
      '<div style="text-align:center;padding:20px;font-size:13px;color:#666;">获取失败<br><a href="' + payUrl + '" style="color:#667eea;text-decoration:underline;" target="_blank">点此打开支付页</a></div>';
  }
}

function startPolling(orderId) {
  if (pollTimer) clearInterval(pollTimer);
  
  pollTimer = setInterval(async () => {
    pollCount++;
    try {
      const res = await fetch(API_BASE + '/query?order_id=' + orderId);
      const data = await res.json();
      
      if (data.status === 'paid') {
        clearInterval(pollTimer);
        document.getElementById('qrTimer').textContent = '✓ 支付成功，正在跳转...';
        setTimeout(() => {
          window.location.href = '/success.html?out_trade_no=' + orderId;
        }, 1000);
      } else if (pollCount > 120) {
        // 10分钟后停止轮询
        clearInterval(pollTimer);
        document.getElementById('qrTimer').textContent = '支付超时，请刷新重试';
      } else {
        const seconds = pollCount * 5;
        document.getElementById('qrTimer').textContent = '等待支付中... (' + seconds + 's)';
      }
    } catch(e) {}
  }, 5000);
}

function closeQr() {
  document.getElementById('qrModal').classList.remove('active');
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
  currentOrderId = null;
}

// 预加载商品
loadProducts().then(() => {
  // 缓存商品数据
  fetch(API_BASE + '/products', {cache:'force-cache'}).then(r => r.json()).then(d => {
    window.__products = d.products;
  });
});
</script>
</body>
</html>
