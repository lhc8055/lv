<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星柚电竞 · 游戏陪玩开黑</title>
<link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin>
<link rel="dns-prefetch" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=ZCOOL+KuaiLe&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=ZCOOL+KuaiLe&display=swap"></noscript>
<style>
:root{
  --pri:#5b6cf0;--pri-soft:#eef0ff;--purple:#8a63ff;
  --ink:#22264b;--sub:#8b90b2;--weak:#b3b8d6;
  --bg:#f3f5fc;--card:#fff;--line:#eceef8;--red:#ff4d4f;
  --r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:20px;--r-xl:24px;
  --shadow:0 8px 24px rgba(84,99,220,.10);
  --shadow-sm:0 4px 12px rgba(84,99,220,.08);
  --tab-h:56px;--head-h:56px;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --ease-std:cubic-bezier(.4,0,.2,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-cute:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font-body);color:var(--ink);-webkit-font-smoothing:antialiased;
  background:#f3f5fc}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;touch-action:manipulation}
input,select,textarea{font-family:inherit;outline:none;border:none;background:none;color:inherit}
img{display:block;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
ul{list-style:none}
a{color:inherit;text-decoration:none}

#app{display:flow-root;position:relative;width:100%;max-width:460px;min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 0 60px rgba(70,80,160,.18);
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));overflow:clip}
@media(min-width:480px){body{padding:0}#app{min-height:100vh;border-radius:0}}

.notice{display:flex;align-items:center;gap:8px;padding:9px 14px;background:linear-gradient(90deg,#fff7e0,#fff2d2);color:#e2492d;font-size:12.5px;font-weight:500;line-height:1.4}
.notice>svg{flex:none;width:15px;height:15px}
.notice .n-close{margin-left:auto;flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#d8906f}
.notice.hide{display:none}

.section-title{display:flex;align-items:center;margin:20px 16px 12px;font-size:16px;font-weight:800}
.section-title .more{margin-left:auto;display:flex;align-items:center;gap:2px;font-size:12px;font-weight:400;color:var(--sub)}
.section-title .more svg{width:13px;height:13px}

.searchbar{display:flex;align-items:center;gap:8px;margin:12px 14px;padding:0 12px 0 14px;height:40px;background:#fff;border-radius:999px;border:1.5px solid #2563eb}
.searchbar .s-go{flex:none;width:30px;height:30px;margin:0 -6px;display:flex;align-items:center;justify-content:center;color:#9ca3af}
.searchbar .s-go svg{width:18px;height:18px}
.searchbar input{flex:1;min-width:0;font-size:14px;color:var(--ink)}
.searchbar input::placeholder{color:#9ca3af}
.s-clear{display:none;flex:none;width:18px;height:18px;border-radius:50%;background:#cfd3e6;color:#fff;align-items:center;justify-content:center}
.s-clear.show{display:flex}
.s-clear svg{width:10px;height:10px}

.banner{position:relative;margin:4px 14px 0;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:2048/896;background:#dbe4ff}
.banner img{width:100%;height:100%;object-fit:cover}
.banner .b-text{position:absolute;top:0;right:0;width:54%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-right:12px}
.banner .b-name{font-family:var(--font-cute);font-size:30px;line-height:1.1;color:#fff;letter-spacing:2px;
  text-shadow:-1.5px -1.5px 0 #7d8cff,1.5px -1.5px 0 #7d8cff,-1.5px 1.5px 0 #7d8cff,1.5px 1.5px 0 #7d8cff,0 3px 0 #6472ec,0 6px 12px rgba(90,104,230,.35)}
.banner .b-sub{margin-top:13px;font-size:10.5px;color:#4a53b0;font-weight:700;line-height:1.9;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.95);padding:7px 11px;border-radius:var(--r-sm);box-shadow:0 3px 8px rgba(110,123,255,.18)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 14px 0}
.quick-card{position:relative;border-radius:var(--r-md);overflow:hidden;aspect-ratio:1536/1024;box-shadow:var(--shadow-sm);transition:transform .32s var(--ease-spring);background:#e9ecfb}
.quick-card:active{transform:scale(.97)}
.quick-card img{width:100%;height:100%;object-fit:cover}
.quick-card .q-center{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px}
.quick-card.hot .q-center{left:47%;right:5%}
.quick-card.all .q-center{left:5%;right:50%}
.quick-card .q-title{font-family:var(--font-cute);font-size:18px;letter-spacing:1px;color:#ff5d9e;text-shadow:0 2px 0 #fff,0 2px 6px rgba(255,255,255,.9)}
.quick-card .q-btn{margin-top:2px;font-size:10.5px;font-weight:600;padding:4px 13px;border-radius:999px}
.quick-card.hot .q-btn{color:#e07a5f;background:rgba(255,218,193,.85)}
.quick-card.all .q-btn{color:#5b8c85;background:rgba(181,234,215,.85)}

.games,.cat-game-row,.order-tabs{scrollbar-width:none}
.games::-webkit-scrollbar,.cat-game-row::-webkit-scrollbar,.order-tabs::-webkit-scrollbar{display:none}
.games{display:flex;align-items:flex-start;flex-wrap:nowrap;overflow-x:auto}
.game{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;transition:transform .32s var(--ease-spring)}
.game:active{transform:scale(.94)}
.gicon{--gr:14px;position:relative;display:flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:var(--gr);box-shadow:0 2px 8px rgba(0,0,0,.1);background:#e7eafa}
.gicon img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.gicon.all{background:linear-gradient(150deg,#dfe6ff,#cfd8ff)}
.gicon.all svg{width:26px;height:26px;color:var(--pri)}
.gname{font-size:12px;font-weight:500;color:#9ca3af}
.game.on .gicon{overflow:visible;box-shadow:0 6px 18px rgba(139,92,246,.32)}
.game.on .gicon::before{content:"";position:absolute;inset:-6px;border-radius:calc(var(--gr) + 6px);
  padding:2.5px;background:linear-gradient(135deg,#7c5cff 0%,#b98cff 45%,#ff9ad5 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;animation:gameRingIn .5s var(--ease-spring) both}
@keyframes gameRingIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.game.on .gname{color:#7c3aed;font-weight:700}
.home-games{gap:20px;padding:20px 16px 12px}
.home-games .game{width:68px}
.home-games .gicon{--gr:13px;width:52px;height:52px}
.home-games .gname{font-size:11.5px;white-space:nowrap}
.home-follow{will-change:transform}

.no-more{text-align:center;color:#a5a9c4;font-size:12px;padding:18px 0 6px}
.no-more::before,.no-more::after{content:"";display:inline-block;width:20px;height:1px;background:#dfe2f0;vertical-align:middle;margin:0 8px}

.goods-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 14px}
.gcard{display:flex;flex-direction:column;height:100%;width:100%;text-align:left;background:var(--card);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .32s var(--ease-spring)}
.gcard:active{transform:scale(.97)}
.gcard.np,.rel.np{transform:none !important;transition:none !important}
.gcard .g-img{flex:none;position:relative;aspect-ratio:1/1;background:#e3e9ff}
.gcard .g-img img{width:100%;height:100%;object-fit:cover}
.gcard .g-tag{position:absolute;left:8px;top:8px;font-size:10px;color:#fff;font-weight:500;padding:3px 8px;border-radius:var(--r-xs);background:linear-gradient(135deg,rgba(255,93,126,.92),rgba(255,138,92,.92))}
.gcard .g-body{flex:1;display:flex;flex-direction:column;gap:8px;padding:11px 11px 13px}
.gcard .g-pre{font-size:10.5px;font-weight:700;line-height:1.2;color:#7c3aed;letter-spacing:.3px;margin-bottom:4px}
.gcard .g-title{font-size:14px;font-weight:800;line-height:1.35;letter-spacing:.2px;color:var(--ink);text-wrap:balance;line-break:strict;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nw{white-space:nowrap}
.gcard .g-tags{display:flex;gap:5px;overflow:hidden}
.gcard .g-tags span{flex:none;font-size:10.5px;color:var(--pri);background:var(--pri-soft);padding:2px 6px;border-radius:6px;white-space:nowrap}
.gcard .g-foot{display:flex;align-items:baseline;justify-content:space-between;margin-top:auto;padding-top:2px}
.gcard .g-price{color:var(--red);font-weight:900;font-size:16px;white-space:nowrap}
.gcard .g-price small{font-size:10px;font-weight:500}
.gcard .g-heat{font-size:11px;color:var(--weak);white-space:nowrap}

.cat-game-row{display:flex;align-items:flex-start;padding:16px 12px 14px;overflow-x:auto}
.cat-game-row .game{width:81px;gap:9px}
.cat-game-row .gicon{--gr:12px;width:48px;height:48px}
.cat-game-row .gname{font-size:12.5px;color:#4b5068}
.cat-game-row .game.on .gname{color:#7c3aed;font-weight:800}
.cat-wrap{display:flex;align-items:flex-start;gap:10px;padding:0 10px 14px}
.cat-side{flex:none;width:88px;background:#fff;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-sm)}
.cat-side .zone{position:relative;display:block;width:100%;text-align:left;padding:15px 12px;font-size:12px;line-height:1.3;color:#9a9eb5;background:#fff}
.cat-side .zone.on{background:#f4f5fa;color:var(--ink);font-weight:800}
.cat-side .zone.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#a78bfa,#7c3aed)}
.cat-main{flex:1;min-width:0;background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow-sm);min-height:340px;padding-bottom:8px}
.sortbar{display:flex;align-items:center;justify-content:center;gap:16px;height:44px;margin:0 8px;border-bottom:1px solid #eeeff5;font-size:13px;color:#9a9ab0}
.cat-main .sortbar{position:sticky;top:0;z-index:6;margin:0;padding:0 8px;border-bottom:none;background:#fff;border-radius:var(--r-md) var(--r-md) 0 0}
.cat-main .sortbar::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:1px;background:#eeeff5}
.sortbar .sort{display:flex;align-items:center;gap:4px;padding:6px 2px;color:#9a9ab0}
.sortbar .sort.on{color:var(--ink);font-weight:800}
.sort-arrows{display:inline-flex;flex-direction:column;gap:2px}
.sort-arrows i{display:block;width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent}
.sort-arrows i.up{border-bottom:4.5px solid #c9cde0}
.sort-arrows i.down{border-top:4.5px solid #c9cde0}
.sort-arrows i.up.on{border-bottom-color:#7c3aed}
.sort-arrows i.down.on{border-top-color:#7c3aed}
.grow{display:flex;gap:10px;width:100%;text-align:left;padding:12px 10px;border-bottom:1px solid #f4f5fa;transition:background .12s}
.grow:last-of-type{border-bottom:none}
.grow:active{background:#f7f8fd}
.grow .gr-img{flex:none;width:76px;height:76px;border-radius:var(--r-sm);overflow:hidden;background:#e3e9ff}
.grow .gr-img img{width:100%;height:100%;object-fit:cover}
.grow .gr-body{flex:1;min-width:0;min-height:76px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.grow .gr-title{font-size:14px;font-weight:800;line-height:1.35;letter-spacing:.2px;color:var(--ink);text-wrap:balance;line-break:strict;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grow .gr-meta{display:flex;align-items:center;gap:6px;margin-top:5px;min-width:0;white-space:nowrap}
.grow .gr-pre{flex:none;font-size:10.5px;font-weight:700;line-height:1;color:#7c3aed;background:#f1ecff;padding:3px 6px;border-radius:5px}
.grow .gr-rank{min-width:0;font-size:11px;color:#a3a6b8;overflow:hidden;text-overflow:ellipsis}
.grow .gr-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.grow .gr-price{color:var(--red);font-weight:800;font-size:17px;line-height:1;white-space:nowrap}
.grow .gr-price small{font-size:11px;font-weight:500}
.grow .gr-heat{font-size:11px;color:#a3a6b8;white-space:nowrap;line-height:1}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:56px 24px;text-align:center;color:var(--sub);font-size:13px;line-height:1.7}
.empty .e-ico{width:84px;height:84px;margin-bottom:8px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center}
.empty .e-ico svg{width:38px;height:38px;stroke-width:1.6}
.empty b{font-size:15px;font-weight:800;color:var(--ink)}
.empty .e-btn{margin-top:10px;padding:9px 26px;border-radius:999px;background:linear-gradient(135deg,var(--pri),var(--purple));color:#fff;font-size:13px;font-weight:700;box-shadow:0 6px 14px rgba(91,108,240,.28);transition:transform .3s var(--ease-spring)}
.empty .e-btn:active{transform:scale(.97)}

.pf-header{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:40px 20px 24px;text-align:center}
button.pf-header:active{opacity:.8}
.pf-avatar{position:relative;width:88px;height:88px;border-radius:50%;overflow:hidden;margin:0 auto 14px;box-shadow:0 6px 20px rgba(91,108,240,.18);border:3px solid #fff;background:#e7eafa}
.pf-avatar img{width:100%;height:100%;object-fit:cover}
.pf-avatar-off img{filter:brightness(.6)}
.pf-avatar-mask{position:absolute;inset:0;border-radius:50%;background:rgba(100,110,130,.25)}
.pf-name{font-size:20px;font-weight:800}
.pf-id{font-size:13px;color:var(--sub);margin-top:4px}
.pf-section{padding:0 16px}
.pf-sec-title{font-size:15px;font-weight:700;margin:8px 4px 12px}
.pf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 4px;background:#fff;border-radius:var(--r-lg);padding:18px 10px;box-shadow:var(--shadow-sm)}
.pf-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.pf-ico{width:44px;height:44px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.08);transition:transform .32s var(--ease-spring)}
.pf-item:active .pf-ico{transform:scale(.9)}
.pf-ico svg{width:22px;height:22px}
.pf-ico.f-blue{background:linear-gradient(135deg,#60a5fa,#3b82f6)}
.pf-ico.f-yellow{background:linear-gradient(135deg,#ffe17a 0%,#ffb02e 50%,#ff9500 100%);box-shadow:0 3px 12px rgba(255,176,46,.35)}
.pf-ico.f-pink{background:linear-gradient(135deg,#f9a8d4,#ec4899)}
.pf-ico.f-orange{background:linear-gradient(135deg,#fb923c,#f97316)}
.pf-ico.f-purple{background:linear-gradient(135deg,#a78bfa,#8b5cf6)}
.pf-ico.f-gray{background:linear-gradient(135deg,#9ca3af,#6b7280)}
.pf-label{font-size:11.5px;color:#555b85;font-weight:500}
.pf-badge{position:absolute;top:-4px;right:calc(50% - 30px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* 优惠券/收藏 新增项渐入动画 */
.coupon.enter,.gcard.enter{animation:itemEnter .52s var(--ease-spring) both}
@keyframes itemEnter{0%{opacity:0;transform:translateY(14px) scale(.96)}100%{opacity:1;transform:none}}

.d-back{flex:none;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;transition:transform .32s var(--ease-spring)}
.d-back:active{transform:scale(.9)}
.d-back svg{width:18px;height:18px}
.page-head{position:sticky;position:-webkit-sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:var(--head-h);padding:0 12px;background:rgba(243,245,252,.92);backdrop-filter:blur(10px)}
.page-head h1{font-size:16px;font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.order-tabs{display:flex;gap:8px;padding:2px 14px 12px;position:sticky;position:-webkit-sticky;top:var(--head-h);z-index:19;background:linear-gradient(180deg,var(--bg) 75%,rgba(243,245,252,0));overflow-x:auto;touch-action:pan-x;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.order-tabs button{position:relative;isolation:isolate;flex:none;font-size:12.5px;color:var(--sub);padding:7px 16px;border-radius:999px;background:#fff;box-shadow:var(--shadow-sm);white-space:nowrap;touch-action:manipulation;cursor:pointer;transition:color .28s var(--ease-std),transform .3s var(--ease-spring)}
.order-tabs button::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,var(--pri),var(--purple));opacity:0;transition:opacity .28s var(--ease-std);z-index:-1}
.order-tabs button:active{transform:scale(.95)}
.order-tabs button.on{color:#fff;font-weight:700}
.order-tabs button.on::before{opacity:1}
.order-list{padding:0 14px}
.order-card{contain:layout style;margin-bottom:12px;background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:14px;border:1px solid rgba(91,108,240,.05)}
#orderBody.swap .order-card,#orderBody.swap .empty{animation:ocIn .38s var(--ease-out) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes ocIn{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:none}}
.oc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--sub);padding-bottom:10px;border-bottom:1px dashed var(--line)}
.oc-status{flex:none;font-weight:700;font-size:12px}
.oc-status.unpaid,.oc-status.pending{color:#ff8a2e}
.oc-status.ongoing{color:var(--pri)}
.oc-status.done{color:#12b779}
.oc-status.refunding,.oc-status.refunded,.oc-status.cancelled{color:#9aa0c4}
.oc-body{display:flex;gap:12px;padding:12px 0}
.oc-img{flex:none;width:64px;height:64px;border-radius:var(--r-sm);overflow:hidden;background:#e3e9ff}
.oc-img img{width:100%;height:100%;object-fit:cover}
.oc-info{flex:1;min-width:0}
.oc-name{font-size:13.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oc-meta{font-size:11.5px;color:var(--sub);margin-top:5px;line-height:1.5;word-break:break-all}
.oc-right{flex:none;text-align:right;color:var(--red);font-weight:900;font-size:15px}
.oc-rate{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);padding:9px 0}
.oc-rate .stars-mini{color:#ffb53d;letter-spacing:1px}
.oc-coupon{font-size:12px;color:#d48806;background:#fff7e6;border:1px solid #ffe7ba;border-radius:8px;padding:6px 10px;margin:8px 0 0}
.oc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:12px;border-top:1px dashed var(--line)}
.oc-total{font-size:12.5px;color:var(--sub)}
.oc-total b{color:var(--red);font-size:16px;font-weight:900}
.oc-actions{display:flex;gap:8px}
.oc-btn{font-size:12px;color:var(--pri);border:1px solid var(--pri);padding:6px 14px;border-radius:999px;white-space:nowrap;transition:transform .3s var(--ease-spring)}
.oc-btn:active{transform:scale(.94)}
.oc-btn.gray{color:#9aa0c4;border-color:#d6daf0;background:#f6f7fc}

<script>
let _fabLocked=false;
let _fabTopPct=null;

function clampFabPct(pct){
  const num=Number(pct);
  if(!Number.isFinite(num)) return null;
  return Math.max(15,Math.min(80,num));
}
function applyFabPosition(pct){
  const fab=document.getElementById('fabBtn');
  const val=clampFabPct(pct);
  if(!fab||val==null) return;
  fab.style.top=val+'%';
  fab.style.bottom='auto';
  fab.style.transform='translateY(-50%)';
  _fabTopPct=val;
  _fabLocked=true;
}

function positionFab(){
  if(_fabLocked) return;
  if(_fabTopPct!=null){
    applyFabPosition(_fabTopPct);
    return;
  }
  const games=document.querySelector('.home-games');
  const grid=document.querySelector('.goods-grid');
  const section=document.querySelector('.section-title');
  let pct=30;
  if(games){
    const gBottom=games.getBoundingClientRect().bottom;
    let topRef=null;
    if(grid) topRef=grid.getBoundingClientRect().top;
    else if(section) topRef=section.getBoundingClientRect().top;
    if(topRef!==null){
      const mid=(gBottom+topRef)/2;
      const vh=window.innerHeight||document.documentElement.clientHeight;
      if(vh>0) pct=Math.max(15,Math.min(80,(mid/vh)*100));
    }
  }
  applyFabPosition(pct);
}

function positionFabWhenReady(){
  if(_fabLocked) return;
  if(_fabTopPct!=null){
    applyFabPosition(_fabTopPct);
    return;
  }
  const view=document.getElementById('view');
  if(!view||!view.firstElementChild){setTimeout(positionFabWhenReady,100);return;}
  const games=view.querySelector('.home-games');
  if(!games){
    if(parseHash().name==="home"){
      setTimeout(positionFabWhenReady,120);
      return;
    }
    return;
  }
  const imgs=view.querySelectorAll('img');
  let allLoaded=true;
  imgs.forEach(img=>{if(!img.complete) allLoaded=false;});
  if(allLoaded){
    positionFab();
  }else{
    let waited=0;
    const check=()=>{
      if(_fabLocked) return;
      let ok=true;
      view.querySelectorAll('img').forEach(img=>{if(!img.complete) ok=false;});
      if(ok||waited>=3000){positionFab();}
      else{waited+=150;setTimeout(check,150);}
    };
    check();
  }
}

window.addEventListener('load',function(){
  positionFabWhenReady();
  setTimeout(function(){if(window._dataReady){try{hidePageLoader()}catch(e){var p=document.getElementById('pageLoader');if(p)p.classList.remove('show')}}},100);
  setTimeout(function(){if(window._dataReady){try{hidePageLoader()}catch(e){var p=document.getElementById('pageLoader');if(p)p.classList.remove('show')}}},2000);
});
setTimeout(function(){try{hidePageLoader()}catch(e){var p=document.getElementById('pageLoader');if(p)p.classList.remove('show')}},3000);
</script>

const IMG_CACHE_DB="xy_img_cache";
const IMG_CACHE_STORE="images";
let _imgCacheDb=null;
function openImgCache(){
  return new Promise((resolve)=>{
    if(_imgCacheDb){resolve(_imgCacheDb);return;}
    try{
      const req=indexedDB.open(IMG_CACHE_DB,1);
      req.onupgradeneeded=()=>{
        const db=req.result;
        if(!db.objectStoreNames.contains(IMG_CACHE_STORE)){
          db.createObjectStore(IMG_CACHE_STORE,{keyPath:"url"});
        }
      };
      req.onsuccess=()=>{_imgCacheDb=req.result;resolve(_imgCacheDb);};
      req.onerror=()=>{resolve(null);};
    }catch(e){resolve(null);}
  });
}
function getCachedImg(url){
  return openImgCache().then(db=>{
    if(!db) return null;
    return new Promise((resolve)=>{
      try{
        const tx=db.transaction(IMG_CACHE_STORE,"readonly");
        const req=tx.objectStore(IMG_CACHE_STORE).get(url);
        req.onsuccess=()=>resolve(req.result||null);
        req.onerror=()=>resolve(null);
      }catch(e){resolve(null);}
    });
  });
}
function putCachedImg(url,blob){
  return openImgCache().then(db=>{
    if(!db) return;
    return new Promise((resolve)=>{
      try{
        const tx=db.transaction(IMG_CACHE_STORE,"readwrite");
        tx.objectStore(IMG_CACHE_STORE).put({url,blob,ts:Date.now()});
        tx.oncomplete=()=>resolve();
        tx.onerror=()=>resolve();
      }catch(e){resolve();}
    });
  });
}
function clearImgCache(){
  return openImgCache().then(db=>{
    if(!db) return;
    return new Promise((resolve)=>{
      try{
        const tx=db.transaction(IMG_CACHE_STORE,"readwrite");
        tx.objectStore(IMG_CACHE_STORE).clear();
        tx.oncomplete=()=>resolve();
        tx.onerror=()=>resolve();
      }catch(e){resolve();}
    });
  });
}

const _imgKeep=new Map();
function srcOf(url){
  if(!url) return "";
  const k=_imgKeep.get(url);
  return k&&k.src?k.src:url;
}
function loadDecoded(src){
  return new Promise(res=>{
    const el=new Image();
    el.decoding="async";
    el.onload=()=>{(el.decode?el.decode().catch(()=>{}):Promise.resolve()).then(()=>res(el));};
    el.onerror=()=>res(null);
    el.src=src;
  });
}
const _persistQ=[];
let _persistBusy=false;
function queuePersist(url){
  _persistQ.push(url);
  setTimeout(pumpPersist,1200);
}
function pumpPersist(){
  if(_persistBusy||!_persistQ.length) return;
  if(document.documentElement.classList.contains("fx-run")){setTimeout(pumpPersist,800);return;}
  _persistBusy=true;
  const url=_persistQ.shift();
  fetch(url,{mode:"cors",credentials:"omit"}).then(r=>r.ok?r.blob():null).then(b=>(b&&b.size)?putCachedImg(url,b):null).catch(()=>{}).then(()=>{_persistBusy=false;setTimeout(pumpPersist,250);});
}
function primeImg(url){
  if(!url||/^data:/.test(url)) return Promise.resolve();
  let k=_imgKeep.get(url);
  if(k) return k.p;
  k={src:url,el:null,p:null};
  _imgKeep.set(url,k);
  k.p=(async()=>{
    let blobUrl=null;
    try{const c=await getCachedImg(url);if(c&&c.blob) blobUrl=URL.createObjectURL(c.blob);}catch(e){}
    if(blobUrl){
      const el=await loadDecoded(blobUrl);
      if(el){k.el=el;k.src=blobUrl;return;}
      try{URL.revokeObjectURL(blobUrl);}catch(e){}
    }
    const el=await loadDecoded(url);
    if(el){k.el=el;queuePersist(url);}
  })();
  return k.p;
}
function primeMany(urls,conc){
  const q=urls.filter(Boolean);
  let i=0,active=0;
  return new Promise(res=>{
    const pump=()=>{
      if(i>=q.length&&active===0){res();return;}
      while(active<conc&&i<q.length){
        active++;
        primeImg(q[i++]).then(()=>{active--;pump();});
      }
    };
    pump();
  });
}

let DATA_VERSION=0;
async function loadSiteData(){
  try{
    const r=await fetch("data.json?_t="+Date.now(),{cache:"no-store"});
    if(!r.ok) return false;
    const d=await r.json();
    if(!d || typeof d!=="object") return false;
    const newVersion=d.dataVersion||0;
    if(newVersion&&newVersion!==DATA_VERSION){
      DATA_VERSION=newVersion;
      try{localStorage.setItem("xy_data_version",String(newVersion));}catch(e){}
      clearImgCache();
    }else if(!DATA_VERSION){
      try{DATA_VERSION=parseInt(localStorage.getItem("xy_data_version")||"0",10)||0;}catch(e){}
    }
    if(d.home){
      if(d.home.bannerImg) IMG.banner=d.home.bannerImg;
      if(d.home.quickHot&&d.home.quickHot.img) IMG.hot=d.home.quickHot.img;
      if(d.home.quickAll&&d.home.quickAll.img) IMG.all=d.home.quickAll.img;
    }
    if(Array.isArray(d.games)&&d.games.length){
      GAMES=d.games.slice().sort((a,b)=>(a.sort||0)-(b.sort||0)).map(g=>({
        id:g.id, name:g.name, alias:(g.alias||[]).slice(), cls:g.cls||"", icon:g.icon, servers:(g.servers||[]).slice()
      }));
    }
    if(Array.isArray(d.zones)&&d.zones.length){
      const sorted=d.zones.slice().sort((a,b)=>(a.sort||0)-(b.sort||0));
      ZONES=[{id:"all",name:"全部"},...sorted.map(z=>({id:z.id,name:z.name}))];
    }
    if(Array.isArray(d.products)&&d.products.length){
      const newProds=d.products.slice().sort((a,b)=>(a.sort||0)-(b.sort||0)).map(p=>({
        id:p.id, game:p.game, zone:p.zone, cat:p.cat, name:p.name,
        desc:p.desc||"", rank:p.rank||"",
        price:Number(p.price)||0, unit:p.unit||"局",
        img:p.img||"", tags:(p.tags||[]).slice(),
        couponEnabled:p.couponEnabled!==false,
        heat:Number(p.heat)||0, sales:Number(p.sales)||0,
        title:"【"+p.cat+"】"+p.name
      }));
      PRODUCTS.length=0;
      newProds.forEach(p=>PRODUCTS.push(p));
    }
    // 优惠券模板：优先用后台配置的，未配置则用内置默认

      COUPONS.length=0;

        id:c.id, cls:c.cls||"", minus:Number(c.minus)||0, need:Number(c.need)||0,
        name:c.name||"优惠券", desc:c.desc||"", validDays:Number(c.validDays)||7,
        scope:c.scope||"all", claimable:c.claimable===true
      }));
    }
    // 弹窗配置：公告 + 图片
    window.POPUPS=d.popups||{notice:{enabled:false},images:{enabled:true,mode:"random",imgs:["pop1.webp","pop2.webp"]}};
    return true;
  }catch(e){ return false; }
}

async function sbRequest(path,opts){
  const method=(opts&&opts.method)||"GET";
  const body=opts&&opts.body;
  const ms=(opts&&opts.ms)||SB_TIMEOUT;
  const headers={"apikey":SB_ANON,"Authorization":"Bearer "+SB_ANON};
  if(body!==undefined){ headers["Content-Type"]="application/json"; headers["Prefer"]="resolution=merge-duplicates,return=representation"; }

  const targets=[];
  for(const base of [_sbActiveUrl].concat(SB_BASE_URLS.filter(u=>u!==_sbActiveUrl))){
    targets.push(base+path);
    for(const p of SB_PROXIES) targets.push(p+encodeURIComponent(base+path));
  }
  let lastErr=null;
  for(const url of targets){
    const ctrl=("AbortController" in window)?new AbortController():null;
    const timer=ctrl?setTimeout(()=>ctrl.abort(),ms):null;
    try{
      const res=await fetch(url,{method,headers,body:body!==undefined?JSON.stringify(body):undefined,signal:ctrl?ctrl.signal:undefined});
      if(timer) clearTimeout(timer);
      if(url===SB_BASE_URLS[0]+path) _sbActiveUrl=SB_BASE_URLS[0];
      const text=await res.text();
      let json=null; try{json=text?JSON.parse(text):null;}catch(e){}
      if(!res.ok){
        const err=new Error((json&&json.message)||("HTTP "+res.status));
        err.code=json&&json.code; err.status=res.status;
        throw err;
      }
      return json;
    }catch(e){
      if(timer) clearTimeout(timer);
      lastErr=e;
      if(e&&e.name==="AbortError"){ lastErr=new Error("云端请求超时"); lastErr.code="TIMEOUT"; }
    }
  }
  throw (lastErr||new Error("云端请求失败"));
}

// 而云端还是旧的 used，此时本地的 active 更新、应优先。因此等级相同时或
// 跨等级冲突时，用 updatedAt 时间戳裁决：更新者胜。
const couponStatusRank=x=>(x&&(x.status==="used"||x.status==="expired"))?2:((x&&x.status==="active")?1:0);
const couponUpdated=x=>x&&(x.updatedAt||x.usedAt||x.expiredAt||x.claimedAt||0);
function pickCoupon(a,b){
  const ra=couponStatusRank(a),rb=couponStatusRank(b);

    const ta=couponUpdated(a),tb=couponUpdated(b);
    if(ra<rb&&ta>tb) return a;
    if(rb<ra&&tb>ta) return b;
    return ra>rb?a:b;
  }
  return couponUpdated(a)>=couponUpdated(b)?a:b;

      if(snapTs&&couponUpdated(x)>snapTs) map[k]=x;

      // 本地有但云端没有：只有当本地是本次会话新领取的（updatedAt>snapTs）才保留
      // snapTs=0 时一律不保留（首次访问，云端为绝对权威）
      if(snapTs&&couponUpdated(x)>snapTs) map[k]=x;
    }else map[k]=pickCoupon(ex,x);
  });
  return Object.values(map);
}
function migrateOrders(){
  let changed=false;
  store.orders.forEach(o=>{
    if(!o.rank&&!o.cat&&!o.tags){
      const p=productById(o.id);
      if(p){
        o.rank=p.rank||"";
        o.tags=(p.tags||[]).slice();
        o.desc=p.desc||"";
        o.cat=p.cat||"";
        o.game=p.game;
        changed=true;
      }
    }
  });
  if(changed) saveStore();
}
loadStore();
dedupeCoupons();
if(store.user&&store.user.uid){
  // 本地缓存已有数据（loadStore 已加载），先快照，再与云端合并
  const _localOrders=JSON.parse(JSON.stringify(store.orders||[]));
  const _localCoupons=JSON.parse(JSON.stringify(store.coupons||[]));
  const _localFavs=JSON.parse(JSON.stringify(store.favs||[]));
  const _localFbs=JSON.parse(JSON.stringify(store.feedbacks||[]));
  // 保存旧的 snapTs（上次同步完成时间），loadUserData 会覆盖为新时间
  // 用旧 snapTs 合并：本次会话新领取的券（updatedAt > 旧 snapTs）才不会被云端删除覆盖
  const _oldSnapTs=getCloudSnapTs(store.user.uid);
  loadUserData(store.user.uid).then(saved=>{
    if(_cloudReachable&&saved){
      // 云端可达：合并云端与本地（订单/优惠券/收藏/反馈全部合并）
      // 用旧 snapTs 判断本地新增（本次会话领取的），云端已删除的不再回写
      const snap=getCloudSnap(store.user.uid);
      store.orders=mergeOrdersPull(saved.orders,_localOrders,snap.orders);
      store.coupons=mergeCouponsPull(saved.coupons,_localCoupons,snap.coupons,_oldSnapTs);
      store.favs=mergeSetPull(saved.favs,_localFavs,snap.favs,x=>x);
      store.feedbacks=mergeSetPull(saved.feedbacks,_localFbs,snap.feedbacks,x=>x.ts);
      store.invitedBy=saved.invitedBy||store.invitedBy||"";
      store.inviteFirstOrderDone=!!saved.inviteFirstOrderDone||store.inviteFirstOrderDone;
      store.registeredAt=saved.registeredAt||store.registeredAt;
      dedupeCoupons();
      saveStore(); // 合并后同步到云端（内部读-改-写，不会覆盖）
    }
    // 云端不可达时：保留本地数据（_localOrders 等），不清空
    // 无论云端是否可达，初始加载已完成，解锁后台同步
    if(window._setInitialSyncDone) window._setInitialSyncDone();
  }).catch(()=>{
    // 异常时保留本地数据，但仍然解锁后台同步
    if(window._setInitialSyncDone) window._setInitialSyncDone();
  });
}

      const i=kv.indexOf("=");
      const k=i<0?kv:kv.slice(0,i);
      const v=i<0?"":kv.slice(i+1);

  }

}

  ],opt);
  const rk=[];
  for(let i=0;i<=12;i++) rk.push({offset:i/12,borderRadius:flyRadius(from,to,f.base,i/12)});
  const c=f.clip.animate(rk,opt);
  f.anims.push(a,c);
  a.onfinish=()=>fxEnd(f,true);
  a.oncancel=()=>fxEnd(f,true);
}
function fxEnd(f,soft){
  if(!f||f.done) return;
  f.done=true;
  clearTimeout(f.guard);
  if(!soft) f.anims.forEach(a=>{a.onfinish=a.oncancel=null;try{a.cancel();}catch(e){}});
  f.undo.forEach(fn=>{try{fn();}catch(e){}});
  f.aux.forEach(a=>{try{a.cancel();}catch(e){}});
  if(f.ghost) killGhost(f.ghost);
  if(fxCur===f) fxCur=null;
  if(soft) requestAnimationFrame(()=>requestAnimationFrame(()=>{f.fly.remove();fxOff();}));
  else{f.fly.remove();fxOff();}
}
function fxFade(f){
  if(!f||f.done) return;
  f.done=true;
  clearTimeout(f.guard);
  f.anims.concat(f.aux).forEach(a=>{try{a.pause();}catch(e){}});
  f.undo.forEach(fn=>{try{fn();}catch(e){}});
  if(f.ghost) killGhost(f.ghost);
  if(fxCur===f) fxCur=null;
  const end=()=>{f.fly.remove();fxOff();};
  if(!f.fly.isConnected){end();return;}
  f.fly.animate([{opacity:1},{opacity:0}],{duration:160,easing:FX_FADE,fill:"forwards"}).onfinish=end;
}
function readFly(f){
  if(!f.launched) return Object.assign({},f.from,{clipT:0,clipB:0});
  try{
    const cs=getComputedStyle(f.fly);
    const m=new DOMMatrixReadOnly(cs.transform&&cs.transform!=="none"?cs.transform:"matrix(1,0,0,1,0,0)");
    const s=m.a||1;
    const cc=getComputedStyle(f.clip);
    const r=k=>(parseFloat(cc[k])||0)*s;
    return {left:m.e,top:m.f,width:f.base.width*s,height:f.base.height*s,
      radii:[r("borderTopLeftRadius"),r("borderTopRightRadius"),r("borderBottomRightRadius"),r("borderBottomLeftRadius")],
      clipT:0,clipB:0};
  }catch(e){return null;}
}
function takeFx(){
  const f=fxCur;
  if(!f||f.done) return null;
  fxCur=null;
  f.frozen=true;
  const st=readFly(f);
  f.anims.concat(f.aux).forEach(a=>{try{a.pause();}catch(e){}});
  let ga=0;
  if(f.ghost&&f.ghost.isConnected){
    ga=parseFloat(getComputedStyle(f.ghost).opacity);
    if(!isFinite(ga)) ga=0;
  }
  if(f.ghost){killGhost(f.ghost);f.ghost=null;}
  let ba=null;
  if(f.kind==="in"){
    const b=$(".detail-bar");
    if(b){ba=parseFloat(getComputedStyle(b).opacity);if(!isFinite(ba)) ba=1;}
  }
  if(!st){fxEnd(f);return null;}
  return {f,st,src:f.src,pid:f.pid,kind:f.kind,a0:clamp(1-ga,0,1),b0:ba};
}

function playHero(t,ghost,carry){
  const hero=$(".detail-hero");
  const rest=$("#view .detail-rest");
  const a0=carry?carry.a0:null,b0=carry?carry.b0:null;
  if(!hero||!ghost){
    killGhost(ghost);
    if(carry) fxEnd(carry.f);
    fxOff();
    return;
  }
  if(FX_LITE||t.card.clipT>1||t.card.clipB>1){
    if(rest) rest.classList.add("fx-in");
    fadeGhost(ghost,fxOff,a0,b0);
    if(carry) fxEnd(carry.f);
    return;
  }
  const bar=$(".detail-bar");
  const h=heroDesc(hero);
  const from=t.card;
  const dur=carry?Math.round(FX_MS*.85):FX_MS;
  const f=fxNew("in",curDetailId,t.src,baseOf(from,h),from);
  f.ghost=ghost;
  f.undo.push(()=>{hero.style.opacity="";if(bar) bar.style.opacity="";});
  f.ready.then(()=>{
    if(f.done||f.frozen) return;
    ghost.classList.add("fly-on");
    hero.style.opacity=".01";
    if(bar) bar.style.opacity="0";
    if(rest) rest.classList.add("fx-in");
    fxGo(f,from,h,dur);
    if(bar) f.aux.push(bar.animate([{opacity:0},{opacity:1}],{duration:280,delay:Math.round(dur*.5),easing:FX_FADE,fill:"both"}));
    fadeGhost(ghost,null,a0,b0);
    if(carry) fxEnd(carry.f);
  });
}
function playBack(back,leftId,ghost,carry){
  const a0=carry?carry.a0:null,b0=carry?carry.b0:null;
  Promise.resolve().then(()=>{
    let card=null,im=null;
    if(back){
      const el=$('#view [data-action="detail"][data-id="'+leftId+'"]');
      const box=el&&el.querySelector(".g-img,.gr-img");
      im=box&&box.querySelector("img");
      if(box){
        const c=cardDesc(box);
        if(c.top<window.innerHeight&&c.top+c.height>0&&c.clipT<=1) card=c;
      }
    }
    if(FX_LITE||!card||!im){
      fadeGhost(ghost,fxOff,a0,b0);
      if(carry) fxEnd(carry.f);
      return;
    }
    const dur=carry?Math.round(FX_MS*.85):FX_MS;
    const f=fxNew("out",leftId,back.src,baseOf(back.h,card),back.h);
    f.ghost=ghost;
    f.undo.push(()=>{im.style.opacity="";});
    f.ready.then(()=>{
      if(f.done||f.frozen) return;
      ghost.classList.add("fly-on","fly-back");
      im.style.opacity=".01";
      fxGo(f,back.h,card,dur);
      fadeGhost(ghost,null,a0,b0);
      if(carry) fxEnd(carry.f);
    });
  });
}

function setFab(show,instant){
  const fab=$("#fabBtn");
  if(!fab) return;
  clearTimeout(fab._t);
  if(show){fab.classList.remove("hide","out");return;}
  if(instant||fab.classList.contains("hide")){fab.classList.remove("out");fab.classList.add("hide");return;}
  fab.classList.add("out");
  fab._t=setTimeout(()=>{fab.classList.add("hide");fab.classList.remove("out");},180);
}

function tabPop(t){
  t.classList.remove("pop");

function centerOrderTab(smooth){
  const tabs=$(".order-tabs");
  const b=tabs&&tabs.querySelector("button.on");
  if(!b) return;
  const max=Math.max(0,tabs.scrollWidth-tabs.clientWidth);
  const t=clamp(b.offsetLeft-(tabs.clientWidth-b.offsetWidth)/2,0,max);
  if(Math.abs(t-tabs.scrollLeft)<2) return;
  if(smooth&&tabs.scrollTo) tabs.scrollTo({left:t,behavior:"smooth"});
  else tabs.scrollLeft=t;
}

function render(keepScroll){
  let r=parseHash();
  let needLogin=false;
  if(!store.user&&AUTH_ROUTES.includes(r.name)){
    history.replaceState(null,"","#/profile");
    r=parseHash();
    needLogin=true;
  }
  if(!VIEWS[r.name]){location.hash="#/home";return;}
  document.querySelectorAll(".tabbar .tab").forEach(t=>{
    const on=t.dataset.route===TAB_OF[r.name];
    const was=t.classList.contains("on");
    t.classList.toggle("on",on);
    if(on&&!was&&TAB_OF[lastRoute]&&TAB_OF[lastRoute]!==TAB_OF[r.name]) tabPop(t);
  });
  const y=window.scrollY;
  const prev=lastRoute,leftId=curDetailId;
  if(prev&&prev!=="detail"&&prev!==r.name){
    scrollCache[prev]=y;
  }
  lastRoute=r.name;
  if(r.name==="detail") curDetailId=parseInt(r.params.id,10)||0;
  let ret=null;
  if(prev==="detail"&&r.name!=="detail"&&retInfo&&retInfo.hash===location.hash) ret=retInfo;
  if(r.name!=="detail") retInfo=null;
  let carry=takeFx();
  const view=$("#view");
  const oldNode=view.firstElementChild;
  let otl=null;
  if(r.name==="orders"&&prev==="orders"){
    const ot=view.querySelector(".order-tabs");
    if(ot) otl=ot.scrollLeft;
  }
  const useStash=!!(ret&&stash&&stash.hash===location.hash&&stash.name===r.name);
  if(r.name==="detail"&&(prev==="home"||prev==="category")&&oldNode&&retInfo){
    stripIds(oldNode);
    stash={hash:retInfo.hash,name:prev,node:oldNode};
  }else if(r.name!=="detail"&&!useStash){
    stash=null;
  }
  const fx=fxOK();
  let heroIn=fx&&r.name==="detail"&&heroFrom&&Date.now()-heroFrom.t<1500?heroFrom:null;
  heroFrom=null;
  if(carry){
    const ok=fx&&!FX_LITE&&(
      (carry.kind==="in"&&r.name!=="detail"&&ret&&ret.hero&&leftId===carry.pid)||
      (carry.kind==="out"&&heroIn&&curDetailId===carry.pid));
    if(!ok){fxFade(carry.f);carry=null;}
    else if(carry.kind==="out") heroIn=Object.assign({},heroIn,{card:carry.st});
  }
  let back=null;
  if(fx&&ret&&ret.hero){
    if(carry&&carry.kind==="in"){
      back={src:carry.src,h:carry.st};
    }else{
      const hero=$(".detail-hero");
      const him=hero&&hero.querySelector("img");
      if(him){
        const h=heroDesc(hero);
        if(h.top<window.innerHeight&&h.top+h.height>0&&h.clipT<=1){
          back={src:him.currentSrc||him.src,h};
        }
      }
    }
  }
  let toY;
  if(ret) toY=ret.y;
  else if(keepScroll===true) toY=y;
  else if(scrollCache[r.name]!=null) toY=scrollCache[r.name];
  else toY=0;
  if(oldNode&&prev==="detail"){
    const rs=oldNode.querySelector(".detail-rest");
    if(rs) rs.classList.remove("fx-in");
  }
  const ghost=fx&&!FX_LITE&&(heroIn||ret)&&oldNode?makeGhost(oldNode,y,toY):null;
  if(ghost){
    if(carry){
      ghost.style.opacity=carry.a0;
      if(ghost._bar&&carry.b0!=null) ghost._bar.style.opacity=carry.b0;
    }
    fxOn();
  }else if(carry){
    fxFade(carry.f);
    carry=null;
  }
  if(useStash){
    view.textContent="";
    restoreIds(stash.node);
    view.appendChild(stash.node);
    stash=null;
  }else{
    view.innerHTML=VIEWS[r.name](r.params);
    markImgs(view);
  }
  if(r.name==="orders"){
    const nt=view.querySelector(".order-tabs");
    if(nt){
      if(otl!=null) nt.scrollLeft=otl;
      else centerOrderTab(false);
    }
  }
  const isDetail=r.name==="detail";
  $("#tabbar").classList.toggle("hide",isDetail);
  setFab(r.name==="home"||r.name==="category",!prev);
  window.scrollTo(0,toY);
  requestAnimationFrame(()=>{
    window.scrollTo(0,toY);
    try{
      var hf=document.getElementById("homeFollow");
      var hg=document.querySelector(".home-games");
      if(hf&&hg){
        var v=50*Math.min(1,Math.max(0,toY/160));
        var up=v*0.6,down=v-up;
        hf.style.transform="translate3d(0,"+(-up).toFixed(2)+"px,0)";
        hf.style.marginBottom=(-up).toFixed(2)+"px";
        hg.style.transform="translate3d(0,"+down.toFixed(2)+"px,0)";
      }
    }catch(e){}
  });
  if(!_fabLocked) requestAnimationFrame(positionFabWhenReady);
  if(!useStash) bindViewEvents();
  if(!FX_LITE&&(heroIn||ghost)) requestAnimationFrame(()=>{
    if(heroIn) playHero(heroIn,ghost,carry);
    else if(ghost) playBack(back,leftId,ghost,carry);
  });
  if(needLogin) openLogin();
  // 给后台同步检测到的新增项加渐入动画
  if(_pendingEnter.coupons.size>0&&r.name==="coupons"){
    requestAnimationFrame(()=>{
      _pendingEnter.coupons.forEach(id=>{
        const el=document.querySelector('.coupon[data-cid="'+id+'"]');
        if(el){ el.classList.add("enter"); setTimeout(()=>el.classList.remove("enter"),600); }
      });
      _pendingEnter.coupons.clear();
    });
  }
  if(_pendingEnter.favs.size>0&&r.name==="favs"){
    requestAnimationFrame(()=>{
      _pendingEnter.favs.forEach(id=>{
        const el=document.querySelector('.gcard[data-pid="'+id+'"]');
        if(el){ el.classList.add("enter"); setTimeout(()=>el.classList.remove("enter"),600); }
      });
      _pendingEnter.favs.clear();
    });
  }
}

function getCouponStatus(id){
  const c=store.coupons.find(x=>x.id===id);
  const def=COUPONS.find(x=>x.id===id);
  if(!c||!def) return "none";
  if(c.status==="used"||c.status==="expired") return c.status;
  if(c.claimedAt&&Date.now()-c.claimedAt>def.validDays*86400000){
    c.status="expired";c.expiredAt=Date.now();c.updatedAt=Date.now();saveStore();
    return "expired";
  }
  return "active";
}
// === 优惠券云端校验 ===
// 创建付款订单使用优惠券前，必须到云端确认：该账号确实持有这张券、且未被使用/未过期，
// 防止本地缓存被篡改或跨设备重复使用同一张券。
async function verifyCouponOnCloud(couponId){
  const def=COUPONS.find(c=>c.id===couponId);
  if(!def) return {ok:false,status:"invalid"};
  if(!store.user||!store.user.uid) return {ok:false,status:"unreachable"};
  let row=null;
  try{ row=await sbSelect(store.user.uid,4000); }
  catch(e){ return {ok:false,status:"unreachable"}; }
  if(row===null) return {ok:false,status:"missing"};
  const cloudCoupons=row.coupons||[];
  const rec=cloudCoupons.find(x=>x.id===couponId);
  if(!rec) return {ok:false,status:"missing"};
  if(rec.status==="used") return {ok:false,status:"used"};
  if(rec.status==="expired") return {ok:false,status:"expired"};
  if(rec.claimedAt&&Date.now()-rec.claimedAt>def.validDays*86400000) return {ok:false,status:"expired"};
  // 兜底防重复：即使优惠券记录因同步失败停留在 active，只要云端已有
  // 未取消订单使用过这张券，就视为已使用，防止同一张券被多笔订单重复抵扣。
  if((row.orders||[]).some(o=>o.couponId===couponId&&o.status!=="cancelled")) return {ok:false,status:"used"};
  return {ok:true,status:"active",rec};
}
// 将云端校验结果落到本地，避免已用/已过期/不存在的券继续被选中
function applyCloudCouponVerdict(couponId,status){
  if(status==="missing"){
    store.coupons=(store.coupons||[]).filter(c=>c.id!==couponId);
  }else if(status==="used"||status==="expired"){
    const c=store.coupons.find(x=>x.id===couponId);
    if(c){ c.status=status; c.updatedAt=Date.now(); if(status==="used"){c.usedAt=Date.now();}else{c.expiredAt=Date.now();} }
  }
  try{localStorage.setItem(STORE_KEY,JSON.stringify(store));}catch(e){}
}

    '<button class="m-btn" data-action="do-buy">提交订单并支付</button>'+
    '<div class="qs-tip">平台担保交易</div>');
  recalcBuy(p);
}
function bestCoupon(p,raw){
  let best=null;
  COUPONS.forEach(c=>{
    if(getCouponStatus(c.id)==="active"&&couponFits(c,p)&&raw>=c.need&&(!best||c.minus>best.minus)) best=c;
  });
  return best;
}
function recalcBuy(p){
  const qty=parseInt(($("#cfQty")&&$("#cfQty").textContent)||"1",10);
  const raw=p.price*qty;
  const c=bestCoupon(p,raw);
  const ded=c?round2(Math.min(c.minus,Math.max(0,raw-0.01))):0;
  let total=round2(raw-ded);
  if(total<0.01) total=0.01;
  $("#cfCoupon").innerHTML=c?'<span class="confirm-coupon">已使用「'+c.name+'」 -¥'+ded+'</span>':'<span style="color:var(--weak);font-weight:400">暂无可用优惠券</span>';
  $("#cfTotal").textContent="¥"+total;
  return {qty,total,coupon:c};
}

function releaseCoupon(o){
  if(!o.couponId) return;
  const c=store.coupons.find(x=>x.id===o.couponId&&x.orderNo===o.no);
  if(!c||c.status!=="used") return;
  // 退还前检查是否已过期：过期则不退还，直接标记为 expired
  const def=COUPONS.find(x=>x.id===o.couponId);
  if(def&&c.claimedAt&&Date.now()-c.claimedAt>def.validDays*86400000){
    c.status="expired";c.expiredAt=Date.now();c.orderNo=null;c.usedAt=null;c.updatedAt=Date.now();
    return;
  }
  c.status="active";c.usedAt=null;c.orderNo=null;c.updatedAt=Date.now();
}
function syncOrders(){
  const now=Date.now();
  let changed=false;
  if(clearCancelledDaily(now)) changed=true;
  const unpaid=store.orders.filter(o=>o.status==="unpaid").sort((a,b)=>b.ts-a.ts);
  unpaid.forEach((o,idx)=>{
    const expired=now-o.ts>UNPAID_TTL;
    const overflow=idx>=MAX_UNPAID;
    if(expired||overflow) changed=removeUnpaidOrder(o)||changed;
  });
  const cancelled=store.orders.filter(o=>o.status==="cancelled").sort((a,b)=>(b.cancelAt||b.ts)-(a.cancelAt||a.ts));
  if(cancelled.length>MAX_CANCELLED){
    const before=store.orders.length;
    const keepC=new Set(cancelled.slice(0,MAX_CANCELLED).map(o=>o.no));
    store.orders=store.orders.filter(o=>{
      if(o.status==="cancelled"&&!keepC.has(o.no)) return false;
      return true;
    });
    if(store.orders.length!==before) changed=true;
  }
  store.orders.forEach(o=>{
    if(o.status==="待接单"){ o.status="pending"; changed=true; }
    if(o.status==="pending"&&now-(o.paidAt||o.ts)>15000){ o.status="ongoing"; changed=true; }
    if(o.status==="refunding"&&o.refundTs&&now-o.refundTs>8000){ o.status="refunded"; changed=true; }
  });
  return changed;
}
function clearCancelledDaily(now){
  const d=new Date(now);
  const clearAt=new Date(d.getFullYear(),d.getMonth(),d.getDate(),CANCEL_CLEAR_HOUR,0,0).getTime();
  if(now>=clearAt&&(store.cancelClearedAt||0)<clearAt){
    store.orders=store.orders.filter(o=>o.status!=="cancelled");
    store.cancelClearedAt=now;
    return true;
  }
  return false;
}
function removeUnpaidOrder(o){
  if(o.status!=="unpaid") return false;
  const i=store.orders.findIndex(x=>x.no===o.no);
  if(i<0) return false;
  store.orders.splice(i,1);
  releaseCoupon(o);
  return true;
}
function unpaidRateLimited(){
  const now=Date.now();
  const recent=store.orders.filter(o=>o.status==="unpaid"&&now-o.ts<=UNPAID_RATE_WINDOW).length;
  return recent>=UNPAID_RATE_LIMIT;
}

  "do-buy":async function(){
    // 防重复提交：并发点击会绕过云端校验窗口，导致同一张券被多笔订单抵扣
    if(window._buying) return;
    const p=currentBuy;
    if(!p) return;
    const btn=$('[data-action="do-buy"]');
    if(btn){btn.disabled=true;btn.style.opacity=".5";}
    window._buying=true;
    try{
      syncOrders();
      if(unpaidRateLimited()){toast("下单太频繁，1分钟内最多创建3个待支付订单，请稍后再试",false);return;}
      const r=recalcBuy(p);
      // 使用优惠券前，先到云端校验该账号是否持有、是否已被使用，防止重复使用/篡改
      if(r.coupon){
        const verdict=await verifyCouponOnCloud(r.coupon.id);
        if(!verdict.ok){
          if(verdict.status==="unreachable"){
            // 云端暂时连不上（网络抖动/GFW 间歇阻断）：不要因为一次网络失败就把下单卡死。
            // 退化为本地校验——只要本地这张券仍 active 且未过期就放行，
            // 订单与优惠券"已使用"状态会在网络恢复后异步同步到云端（防重复抵扣仍在云端兜底）。
            const lc=store.coupons.find(x=>x.id===r.coupon.id);
            const def=COUPONS.find(c=>c.id===r.coupon.id);
            // 本地订单级防重复：如果本地已有未取消订单使用过这张券，不允许再次使用
            const localUsedByOrder=(store.orders||[]).some(o=>o.couponId===r.coupon.id&&o.status!=="cancelled");
            const valid=lc&&(lc.status==="active"||!lc.status)&&def&&(!lc.claimedAt||Date.now()-lc.claimedAt<=def.validDays*86400000)&&!localUsedByOrder;
            if(!valid){
              applyCloudCouponVerdict(r.coupon.id,"missing");
              recalcBuy(p);
              toast("优惠券已失效，已为您移除",false);
              return;
            }
          }else{
            applyCloudCouponVerdict(r.coupon.id,verdict.status);
            recalcBuy(p);
            const msg={missing:"优惠券不存在或已失效，已为您移除",used:"该优惠券已被使用，已为您移除",expired:"该优惠券已过期，已为您移除",invalid:"优惠券不可用"}[verdict.status];
            toast(msg||"优惠券不可用，请重新确认",false);
            return;
          }
        }
      }
      // 二次本地校验：云端校验返回后、标记使用前，再确认一次券仍为 active。
      // 防止在云端校验等待期间，另一次提交（虽被 _buying 拦截，此处为纵深防御）已将券标记为 used。
      if(r.coupon){
        const lc=store.coupons.find(x=>x.id===r.coupon.id);
        if(!lc||lc.status==="used"||lc.status==="expired"){
          recalcBuy(p);
          toast("优惠券状态已变更，请重新选择",false);
          return;
        }
      }
      const payType=($(".pay-method.selected")||{dataset:{}}).dataset.pay||"alipay";
      const no="XY"+String(Date.now()).slice(-8)+Math.floor(Math.random()*90+10);
      const order={
        no,id:p.id,title:p.title,img:p.img,gameName:gameById(p.game).name,
        price:p.price,qty:r.qty,unit:p.unit,server:$("#cfServer").value,note:($("#cfNote").value||"").trim(),
        total:r.total,ts:Date.now(),status:"unpaid",payType,couponId:r.coupon?r.coupon.id:null,
        rank:p.rank||"",tags:(p.tags||[]).slice(),desc:p.desc||"",cat:p.cat||"",game:p.game
      };
      if(r.coupon){
        const c=store.coupons.find(x=>x.id===r.coupon.id);
        if(c&&c.status==="active"){c.status="used";c.usedAt=Date.now();c.orderNo=no;c.updatedAt=Date.now();}
      }
      store.orders.push(order);
      // 本地立即保存（含订单），然后等待云端同步完成再跳转支付，
      // 避免页面跳转中断云端写入导致订单只存本地、不同步到其他浏览器
      const cloudP=saveStore();
      await Promise.race([cloudP,new Promise(r=>setTimeout(r,3000))]); // 最多等 3 秒，超时也跳转
      closeSheet();
      startPayment(no,p.title,r.total,payType);
    }finally{
      window._buying=false;
      if(btn){btn.disabled=false;btn.style.opacity="";}
    }
  }
};

/* MD5 (blueimp-md5) */
function safeAdd(x,y){var lsw=(x&0xffff)+(y&0xffff);var msw=(x>>16)+(y>>16)+(lsw>>16);return(msw<<16)|(lsw&0xffff);}
function bitRotateLeft(n,c){return(n<<c)|(n>>>(32-c));}
function md5cmn(q,a,b,x,s,t){return safeAdd(bitRotateLeft(safeAdd(safeAdd(a,q),safeAdd(x,t)),s),b);}
function md5ff(a,b,c,d,x,s,t){return md5cmn((b&c)|(~b&d),a,b,x,s,t);}
function md5gg(a,b,c,d,x,s,t){return md5cmn((b&d)|(c&~d),a,b,x,s,t);}

function paySign(params,key){
  const str=Object.keys(params).sort().filter(k=>k!=="sign"&&k!=="sign_type"&&params[k]!==""&&params[k]!=null).map(k=>k+"="+params[k]).join("&");
  return md5(str+key).toLowerCase();
}
function startPayment(orderNo,name,money,payType){
  const ov=document.createElement("div");
  ov.className="pay-loading-overlay";
  ov.innerHTML='<div class="pl-spinner"></div><div class="pl-text">正在跳转到收银台…</div><div class="pl-sub">请稍候，正在安全连接支付网关</div>';
  document.body.appendChild(ov);
  const params={
    pid:PAY_CONFIG.pid,type:payType||"alipay",out_trade_no:orderNo,notify_url:PAY_CONFIG.notifyUrl,
    return_url:"https://88sss.top/?trade_status=TRADE_SUCCESS&out_trade_no="+orderNo,
    name,money:money.toFixed(2)
  };
  params.sign=paySign(params,PAY_CONFIG.key);
  params.sign_type="MD5";
  const payUrl=PAY_CONFIG.gateway+"?"+new URLSearchParams(params).toString();
  setTimeout(()=>{location.href=payUrl;},50);
}

  const ov=$(".pay-loading-overlay");

}

});

function queryPaid(no){
  const url=PAY_CONFIG.queryApi+"?out_trade_no="+encodeURIComponent(no);
  return fetch(url).then(r=>r.json()).then(d=>{
    if(!d) return false;
    const st=String(d.status==null?"":d.status).toLowerCase();
    if(st==="1"||st==="paid"||st==="success"||st==="true") return true;
    if(d.trade_status==="TRADE_SUCCESS") return true;
    if(String(d.code)==="1"&&st==="1") return true;
    return false;
  }).catch(()=>false);
}
function markPaid(o,forceJump){
  o.status="pending";o.paidAt=Date.now();
  saveStore();
  toast("支付成功！订单已提交");
  if(!forceJump&&parseHash().name==="orders") render(true);
  else setTimeout(()=>go("#/orders?f=pending"),800);
}
let _pollTimer=null;
function pollUnpaidOrders(){
  clearTimeout(_pollTimer);
  if(document.hidden){_pollTimer=setTimeout(pollUnpaidOrders,5000);return;}
  const unpaid=store.orders.filter(o=>o.status==="unpaid");
  unpaid.forEach(o=>{
    queryPaid(o.no).then(paid=>{if(paid&&o.status==="unpaid") markPaid(o);});
  });
  _pollTimer=setTimeout(pollUnpaidOrders,unpaid.length?2000:15000);
}
function verifyPayReturn(no,successFlag){
  const o=findOrder(no);
  if(!o) return;
  if(o.status!=="unpaid"){go("#/orders?f=pending");return;}
  if(successFlag){markPaid(o,true);return;}
  queryPaid(no).then(paid=>{
    if(paid){markPaid(o,true);return;}
    toast("正在确认支付结果，请稍候…",false);
    go("#/orders?f=unpaid");
  });
}

const genUserId=uid=>{
  let h=0;
  for(let i=0;i<uid.length;i++) h=((h<<5)-h+uid.charCodeAt(i))|0;
  return normUid("XY"+String(Math.abs(h)%900000+100000));
};
async function processAzeLogin(d){
  if(!(d.code===0&&d.social_uid)){toast("登录失败："+(d.msg||"未知错误"),false);return;}
  const nick=(d.nickname||"用户"+String(d.social_uid).slice(-4)).slice(0,12);
  let avatar=String(d.faceimg||"").replace(/^http:/,"https:");
  if(!/^https:\/\//.test(avatar)) avatar="";
  const labels={qq:"QQ",wx:"微信",alipay:"支付宝",sina:"微博",baidu:"百度",douyin:"抖音",huawei:"华为",xiaomi:"小米",google:"Google",microsoft:"微软",dingtalk:"钉钉",feishu:"飞书",gitee:"Gitee",github:"GitHub"};
  const label=labels[d.type]||"账号";
  const uid=genUserId(String(d.social_uid));
  // 登录前本地可能有未登录时的临时数据，快照后与云端合并
  const _preOrders=JSON.parse(JSON.stringify(store.orders||[]));
  const _preCoupons=JSON.parse(JSON.stringify(store.coupons||[]));
  const _preFavs=JSON.parse(JSON.stringify(store.favs||[]));
  const _preFbs=JSON.parse(JSON.stringify(store.feedbacks||[]));
  // 保存旧 snapTs，loadUserData 会覆盖
  const _oldSnapTs=getCloudSnapTs(uid);
  const saved=(await loadUserData(uid))||{};
  // 登录时：云端与本地合并（订单/优惠券/收藏/反馈全部合并）
  // 用旧 snapTs 判断本地新增，云端已删除的不再回写
  const _loginSnap=getCloudSnap(uid);
  store.orders=mergeOrdersPull(saved.orders,_preOrders,_loginSnap.orders);
  store.coupons=mergeCouponsPull(saved.coupons,_preCoupons,_loginSnap.coupons,_oldSnapTs);
  store.favs=mergeSetPull(saved.favs,_preFavs,_loginSnap.favs,x=>x);
  store.feedbacks=mergeSetPull(saved.feedbacks,_preFbs,_loginSnap.feedbacks,x=>x.ts);
  store.invitedBy=saved.invitedBy||"";
  store.inviteFirstOrderDone=!!saved.inviteFirstOrderDone;
  dedupeCoupons();
  const isNew=!saved.registeredAt;
  store.user={name:nick,contact:label,uid,aze:{uid:d.social_uid,avatar,type:d.type},loginAt:Date.now()};
  if(isNew) store.registeredAt=Date.now();
  else store.registeredAt=saved.registeredAt;
  // 始终保存：本地立即写入（含订单），云端异步读-改-写同步，不阻塞
  saveStore();
  const inviteCode=window._pendingInvite||"";
  window._pendingInvite="";
  if(isNew&&inviteCode){
    store.invitedBy=inviteCode;
    if(grantCoupon("c4")){
      toast(label+"登录成功，已获得2元无门槛优惠券");
    }else{
      toast(label+"登录成功，欢迎来到星柚电竞");
    }
  }else{
    toast(label+"登录成功，欢迎来到星柚电竞");
  }
  saveStore();
  go("#/profile");
}
function azeCallback(code,type){
  toast("登录中…");
  const url=AZE_CONFIG.proxy+"?act=callback&appid="+AZE_CONFIG.appid+"&appkey="+AZE_CONFIG.appkey+"&type="+encodeURIComponent(type)+"&code="+encodeURIComponent(code);
  fetch(url,{mode:"cors"}).then(r=>r.json()).then(processAzeLogin).catch(()=>toast("网络异常，请重试",false));
}
function azeReturn(raw){
  try{
    let s=raw.replace(/ /g,"+").replace(/-/g,"+").replace(/_/g,"/");
    while(s.length%4) s+="=";
    const bin=atob(s);
    let pct="";
    for(let i=0;i<bin.length;i++) pct+="%"+("00"+bin.charCodeAt(i).toString(16)).slice(-2);
    processAzeLogin(JSON.parse(decodeURIComponent(pct)));
  }catch(e){toast("登录数据解析失败",false);}
}
function handleUrlParams(){
  const q=Object.fromEntries(new URLSearchParams(location.search));
  const isPay=q.out_trade_no;
  const isCallback=q.code&&q.type;
  const isReturn=q.aze_login==="1"&&q.u;
  if(!(isPay||isCallback||isReturn)) return false;
  history.replaceState(null,"",location.pathname+location.hash);
  if(isPay) verifyPayReturn(q.out_trade_no,q.trade_status==="TRADE_SUCCESS");
  else if(isCallback) azeCallback(q.code,q.type);
  else azeReturn(q.u);
  return true;
}

function initPromo(){
  const noticeBox=$("#noticeModal");
  const imgBox=$("#promoBox");

  // 已看过的标记（本次会话内不重复弹）
  let noticeSeen=false, imgSeen=false;
  try{ noticeSeen=!!sessionStorage.getItem("xy_notice_seen"); }catch(e){}
  try{ imgSeen=!!sessionStorage.getItem("xy_promo_seen"); }catch(e){}

  // 实时读取配置（后台同步后可即时更新）
  function getNoticeCfg(){ return (window.POPUPS&&window.POPUPS.notice)||{}; }
  function getImgCfg(){ return (window.POPUPS&&window.POPUPS.images)||{}; }

  // 显示公告（优先）
  function showNotice(){
    if(!noticeBox) return;
    const nc=getNoticeCfg();
    if(!nc.enabled||noticeSeen) { showImages(); return; }
    updateNoticeContent();
    $("#noticeIcon").innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2z"/><path d="M8 9h8M8 12h5"/></svg>';
    try{sessionStorage.setItem("xy_notice_seen","1");}catch(e){}
    noticeBox.classList.remove("closing");
    noticeBox.classList.add("show");
    $("#noticeBtn").onclick=closeNotice;
    noticeBox.onclick=function(e){ if(e.target===noticeBox) closeNotice(); };
  }
  // 实时更新公告内容（后台改了文字，弹窗立即同步）
  function updateNoticeContent(){
    const nc=getNoticeCfg();
    if($("#noticeTitle")) $("#noticeTitle").textContent=nc.title||"公告";
    if($("#noticeBody")) $("#noticeBody").textContent=nc.body||"";
    if($("#noticeBtn")) $("#noticeBtn").textContent=nc.btnText||"我知道了";
  }
  function closeNotice(){
    if(noticeBox.classList.contains("closing")) return;
    noticeBox.classList.add("closing");
    setTimeout(()=>{
      noticeBox.classList.remove("show","closing");
      // 公告关闭后才显示图片弹窗
      showImages();
    },200);
  }

  // 显示图片弹窗
  function showImages(){
    const imgCfg=getImgCfg();
    if(!imgBox||!imgCfg.enabled||imgSeen) { imgBox&&imgBox.remove(); return; }
    const imgs=Array.isArray(imgCfg.imgs)&&imgCfg.imgs.length?imgCfg.imgs:["pop1.webp"];
    let pick;
    if(imgCfg.mode==="loop"&&imgs.length>1){
      // 循环：按顺序取（用 sessionStorage 记录上次索引）
      let idx=0;
      try{ idx=parseInt(sessionStorage.getItem("xy_promo_idx")||"0",10)||0; }catch(e){}
      pick=imgs[idx%imgs.length];
      try{ sessionStorage.setItem("xy_promo_idx",String((idx+1)%imgs.length)); }catch(e){}
    }else if(imgCfg.mode==="random"&&imgs.length>1){
      pick=imgs[Math.floor(Math.random()*imgs.length)];
    }else{
      pick=imgs[0];
    }
    const img=$("#promoImg");
    const close=()=>{ imgBox.classList.remove("show"); setTimeout(()=>imgBox.remove(),300); };
    img.onload=()=>{
      try{ sessionStorage.setItem("xy_promo_seen","1"); }catch(e){}
      setTimeout(()=>imgBox.classList.add("show"),380);
    };
    img.onerror=()=>imgBox.remove();
    img.src=pick;
    $("#promoClose").onclick=close;
    imgBox.onclick=e=>{ if(e.target===imgBox) close(); };
  }

  // 启动：先公告，公告关闭后图片
  showNotice();

  // 实时轮询：公告显示中时，后台改了文字立即同步
  setInterval(()=>{
    if(document.hidden) return;
    // 公告弹窗正在显示 → 实时更新文字
    if(noticeBox&&noticeBox.classList.contains("show")&&!noticeBox.classList.contains("closing")){
      updateNoticeContent();
    }
  },2000);
}

(async function(){
  showPageLoader();
  await loadSiteData();
  migrateOrders();
  // 优化登录/支付回调体验：URL 含回调参数时优先处理，跳过图片预加载等待
  // 登录回调的 fetch 与 render 并行，避免从QQ授权回来后还要等图片预加载
  const hasUrlCallback=handleUrlParams();
  if(hasUrlCallback){
    // 登录/支付回调场景：跳过图片预加载等待，直接渲染（登录后跳转个人页，首页图片不重要）
    window._dataReady=true;
    stash=null;
    render();
    hidePageLoader();
  }else{
    await Promise.race([primeMany(criticalImgs(),6),new Promise(r=>setTimeout(r,1600))]);
    window._dataReady=true;
    stash=null;
    render();
    hidePageLoader();
  }
  try{fetch(PAY_CONFIG.queryApi+"?out_trade_no=__warm__").catch(()=>{});}catch(e){}
  setTimeout(pollUnpaidOrders,400);
  // 弹窗配置实时更新：定期检查 data.json 的 dataVersion，发现更新就刷新 window.POPUPS
  setInterval(async ()=>{
    if(document.hidden) return;
    try{
      const r=await fetch("data.json?_t="+Date.now(),{cache:"no-store"});
      if(!r.ok) return;
      const d=await r.json();
      if(!d||!d.dataVersion) return;
      if(d.dataVersion!==DATA_VERSION){
        // 版本变了，重新加载配置（包括弹窗）
        await loadSiteData();
      }
    }catch(e){}
  },5000);
  // 跨浏览器实时同步：在订单/优惠券/收藏/个人页每 2 秒从云端拉取
  const SYNC_PAGES=["orders","coupons","favs","profile"];
  let _bgSync=false;
  // 初始加载未完成前不允许后台同步，防止本地旧缓存被回写云端
  let _initialSyncDone=false;
  window._setInitialSyncDone=()=>{_initialSyncDone=true;};
  // 安全超时：即使 loadUserData 卡住，8 秒后也解锁后台同步
  setTimeout(()=>{ _initialSyncDone=true; },8000);
  // 进入优惠券/收藏页时立即触发一次同步（去抖动）
  let _hashSyncTimer=null;
  window.addEventListener("hashchange",()=>{
    if(!_initialSyncDone||!store.user||!store.user.uid) return;
    const page=parseHash().name;
    if(!SYNC_PAGES.includes(page)) return;
    clearTimeout(_hashSyncTimer);
    _hashSyncTimer=setTimeout(()=>{ _doBgSync(); },300);
  });
  async function _doBgSync(){
    if(_bgSync||document.hidden) return;
    if(!store.user||!store.user.uid) return;
    if(!SYNC_PAGES.includes(parseHash().name)||$(".mask")) return;
    _bgSync=true;
    try{
      if(syncOrders()){ await saveStore(); render(true); }
      const ch=await refreshUserDataFromCloud();
      if(ch&&ch.any){
        saveStore();
        if(ch.newCouponIds&&ch.newCouponIds.length){
          ch.newCouponIds.forEach(id=>_pendingEnter.coupons.add(id));
        }
        if(ch.newFavIds&&ch.newFavIds.length){
          ch.newFavIds.forEach(id=>_pendingEnter.favs.add(id));
        }
        render(true);
      }
    }finally{ _bgSync=false; }
  }
  setInterval(_doBgSync,2000);
  initPromo();
  if(window.requestIdleCallback) requestIdleCallback(()=>primeMany(restImgs(),3),{timeout:2500});
  else setTimeout(()=>primeMany(restImgs(),3),600);
})();

    c.style.transform="translate3d(0,"+(-up).toFixed(2)+"px,0)";
    c.style.marginBottom=(-up).toFixed(2)+"px";
    g.style.transform="translate3d(0,"+down.toFixed(2)+"px,0)";
  }
  function tick(){
    raf=0;
    var d=target-cur;
    if(Math.abs(d)<0.05){cur=target;apply(cur);return;}
    cur+=d*EASE;
    apply(cur);
    raf=requestAnimationFrame(tick);
  }
  function onScroll(){
    target=calc();
    if(!raf) raf=requestAnimationFrame(tick);
  }
  function sync(){
    target=calc();
    cur=target;
    last="";
    apply(cur);
  }
  window.addEventListener("scroll",onScroll,{passive:true});
  window.addEventListener("resize",sync);
  new MutationObserver(sync).observe(document.getElementById("view"),{childList:true});
  sync();
})();
</script>
</body>
</html>
