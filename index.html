<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞云商城 - 虚拟商品自动发货</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 900px; margin: 0 auto; }
.header {
  text-align: center;
  color: white;
  padding: 40px 0 30px;
}
.header h1 { font-size: 32px; margin-bottom: 8px; }
.header p { opacity: 0.85; font-size: 14px; }
.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
  margin-top: 20px;
}
.card {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  transition: transform 0.3s, box-shadow 0.3s;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 15px 50px rgba(0,0,0,0.2);
}
.card-icon {
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 64px;
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
}
.card-body { padding: 18px; }
.card-title {
  font-size: 17px;
  font-weight: 600;
  color: #333;
  margin-bottom: 6px;
}
.card-desc {
  font-size: 13px;
  color: #888;
  margin-bottom: 14px;
  line-height: 1.5;
  height: 40px;
  overflow: hidden;
}
.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.price {
  font-size: 22px;
  font-weight: 700;
  color: #ff4757;
}
.price span { font-size: 14px; font-weight: 400; }
.buy-btn {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.buy-btn:hover { opacity: 0.9; }
.buy-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* 弹窗 */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: white;
  border-radius: 16px;
  width: 100%;
  max-width: 400px;
  padding: 30px;
  text-align: center;
}
.modal h3 { font-size: 20px; margin-bottom: 10px; color: #333; }
.modal .product-name { color: #666; margin-bottom: 20px; }
.modal .amount {
  font-size: 36px;
  font-weight: 700;
  color: #ff4757;
  margin: 16px 0;
}
.modal .amount span { font-size: 18px; }
.pay-btn {
  width: 100%;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 10px;
}
.pay-btn:hover { opacity: 0.9; }
.close-btn {
  margin-top: 12px;
  background: none;
  border: none;
  color: #999;
  cursor: pointer;
  font-size: 14px;
}

/* 加载中 */
.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid #f3f3f3;
  border-top: 2px solid #667eea;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  vertical-align: middle;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.footer {
  text-align: center;
  color: rgba(255,255,255,0.7);
  padding: 40px 0 20px;
  font-size: 12px;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🚀 飞云商城</h1>
    <p>虚拟商品 · 自动发货 · 24小时在线</p>
  </div>

  <div class="products" id="productList">
    <div style="grid-column: 1/-1; text-align:center; color:white; padding:40px;">
      <div class="loading" style="width:30px; height:30px;"></div>
      <p style="margin-top:10px;">加载中...</p>
    </div>
  </div>

  <div class="footer">
    Powered by 飞云商城 · 支付成功自动发货
  </div>
</div>

<!-- 购买弹窗 -->
<div class="modal-overlay" id="buyModal">
  <div class="modal">
    <h3>确认购买</h3>
    <p class="product-name" id="modalProductName">-</p>
    <div class="amount"><span>¥</span><span id="modalPrice">0.00</span></div>
    <button class="pay-btn" id="payBtn" onclick="goPay()">立即支付</button>
    <button class="close-btn" onclick="closeModal()">取消</button>
  </div>
</div>

<script>
let currentProduct = null;

// 加载商品列表
async function loadProducts() {
  try {
    const res = await fetch('https://fy-store.pages.dev/api/products');
    const data = await res.json();
    renderProducts(data.products);
  } catch (e) {
    document.getElementById('productList').innerHTML = 
      '<div style="grid-column:1/-1;text-align:center;color:white;padding:40px;">商品加载失败，请刷新重试</div>';
  }
}

function renderProducts(products) {
  const list = document.getElementById('productList');
  list.innerHTML = products.map(p => `
    <div class="card">
      <div class="card-icon">${p.icon}</div>
      <div class="card-body">
        <div class="card-title">${p.name}</div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-footer">
          <div class="price"><span>¥</span>${p.price}</div>
          <button class="buy-btn" onclick="buyProduct('${p.id}')">立即购买</button>
        </div>
      </div>
    </div>
  `).join('');
}

function buyProduct(id) {
  fetch('https://fy-store.pages.dev/api/products')
    .then(r => r.json())
    .then(data => {
      const p = data.products.find(x => x.id === id);
      if (!p) return;
      currentProduct = p;
      document.getElementById('modalProductName').textContent = p.name;
      document.getElementById('modalPrice').textContent = p.price;
      document.getElementById('buyModal').classList.add('active');
    });
}

function closeModal() {
  document.getElementById('buyModal').classList.remove('active');
}

async function goPay() {
  if (!currentProduct) return;
  
  const btn = document.getElementById('payBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span> 创建订单中...';
  
  try {
    const res = await fetch('https://fy-store.pages.dev/api/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        productId: currentProduct.id
      })
    });
    const data = await res.json();
    
    if (data.success && data.payUrl) {
      // 跳转到支付页面
      window.location.href = data.payUrl;
    } else {
      alert('创建订单失败: ' + (data.error || '未知错误'));
      btn.disabled = false;
      btn.innerHTML = '立即支付';
    }
  } catch (e) {
    alert('网络错误: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = '立即支付';
  }
}

loadProducts();
</script>
</body>
</html>
