<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffb7c5">
<link rel="dns-prefetch" href="https://fy-store.pages.dev">
<title>支付成功 - 少女漫画風商店</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Georgia','Times New Roman',serif;background:#fff5f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border:2px solid rgba(255,183,197,.3);border-radius:28px;padding:36px 28px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 60px rgba(232,121,160,.2);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#ffb7c5 1px,transparent 1px);background-size:12px 12px;opacity:.04}
.icon{width:70px;height:70px;background:linear-gradient(135deg,#ffb7c5,#f472b6);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#fff;animation:pop .5s ease;position:relative;z-index:1}
.icon svg{width:36px;height:36px}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
h2{font-size:22px;color:#e879a0;margin-bottom:6px;position:relative;z-index:1}
.subtitle{color:#b06080;font-size:13px;margin-bottom:20px;font-style:italic;position:relative;z-index:1}
.amount{font-size:36px;font-weight:900;color:#ff6b8a;margin:12px 0;font-style:italic;position:relative;z-index:1}
.amount span{font-size:18px;font-weight:600;color:#ffb7c5}
.info-box{background:#fff5f7;border-radius:16px;padding:14px;text-align:left;margin:16px 0;border:2px solid rgba(255,183,197,.15);position:relative;z-index:1}
.info-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.info-row .label{color:#b06080}
.info-row .value{color:#6b3a5a;font-weight:600}
.goods-box{background:linear-gradient(135deg,#fff5f7,#fce7f3);border-radius:16px;padding:16px;margin:16px 0;text-align:left;border:2px dashed #ffb7c5;position:relative;z-index:1}
.goods-title{font-size:14px;font-weight:700;color:#e879a0;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.goods-title svg{width:18px;height:18px;flex-shrink:0}
.goods-content{font-size:13px;color:#6b3a5a;line-height:1.6;word-break:break-all;white-space:pre-wrap;font-family:monospace}
.copy-btn{width:100%;background:linear-gradient(135deg,#ffb7c5,#f472b6);color:#fff;border:none;padding:14px;border-radius:9999px;font-size:14px;cursor:pointer;margin-top:12px;font-weight:700;box-shadow:0 6px 16px rgba(255,183,197,.4);transition:all .3s}
.copy-btn:active{transform:scale(.96);opacity:.85}
.back-btn{width:100%;background:#fff;color:#e879a0;border:2px solid #ffb7c5;padding:12px;border-radius:9999px;font-size:14px;cursor:pointer;margin-top:10px;font-weight:600;transition:all .3s}
.back-btn:active{background:#fff5f7;transform:scale(.96)}
.loading{display:inline-block;width:30px;height:30px;border:3px solid #fce7f3;border-top:3px solid #f472b6;border-radius:50%;animation:spin .8s linear infinite;margin:20px 0}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div id="loading">
    <div class="loading"></div>
    <p style="color:#b06080;font-size:13px;">正在查询订单状态...</p>
  </div>
  <div id="successContent" style="display:none;">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2>支付成功</h2>
    <p class="subtitle">感谢您的购买，商品已自动发放</p>
    <div class="amount"><span>¥</span><span id="amount">0.00</span></div>
    <div class="info-box">
      <div class="info-row">
        <span class="label">商品</span>
        <span class="value" id="productName">-</span>
      </div>
      <div class="info-row">
        <span class="label">订单号</span>
        <span class="value" id="orderId">-</span>
      </div>
    </div>
    <div class="goods-box">
      <div class="goods-title">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4" width="18" height="16" rx="2" stroke="#e879a0" stroke-width="2"/>
          <path d="M3 8h18" stroke="#e879a0" stroke-width="2"/>
          <path d="M8 12h8M8 16h5" stroke="#e879a0" stroke-width="2" stroke-linecap="round"/>
        </svg>
        卡密信息
      </div>
      <div class="goods-content" id="goodsContent">-</div>
      <button class="copy-btn" onclick="copyGoods()">复制卡密</button>
    </div>
    <button class="back-btn" onclick="goHome()">返回商城首页</button>
  </div>
  <div id="customContent" style="display:none;">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2>支付成功</h2>
    <p class="subtitle">正在跳转到客服QQ...</p>
    <div class="amount"><span>¥</span><span id="customAmount">0.00</span></div>
    <div class="info-box">
      <div class="info-row">
        <span class="label">商品</span>
        <span class="value" id="customProductName">-</span>
      </div>
      <div class="info-row">
        <span class="label">订单号</span>
        <span class="value" id="customOrderId">-</span>
      </div>
    </div>
    <p style="color:#b06080;font-size:13px;margin:12px 0;line-height:1.6;">请添加客服QQ联系代练事宜<br>页面将在 <span id="countdown" style="color:#ff6b8a;font-weight:700">2</span> 秒后自动跳转</p>
    <a href="https://qm.qq.com/q/7s7UawEbOo" class="copy-btn" style="display:block;text-decoration:none;">立即添加客服QQ</a>
    <button class="back-btn" onclick="goHome()">返回商城首页</button>
  </div>
  <div id="failContent" style="display:none;">
    <div class="icon" style="background:linear-gradient(135deg,#ff6b8a,#e879a0);">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <h2>未查询到订单</h2>
    <p class="subtitle">订单不存在或尚未支付</p>
    <button class="copy-btn" onclick="goHome()">返回商城</button>
  </div>
</div>

<script>
const API_BASE = 'https://fy-store.pages.dev/api';

function getQueryParam(name) {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(name);
}

async function checkOrder() {
  const outTradeNo = getQueryParam('out_trade_no');
  const orderId = getQueryParam('order_id') || outTradeNo;
  
  if (!orderId) {
    showFail();
    return;
  }
  
  try {
    const res = await fetch(API_BASE + '/query?order_id=' + orderId);
    const data = await res.json();
    
    if (data.status === 'paid') {
      showSuccess(data);
    } else {
      showFail();
    }
  } catch (e) {
    showFail();
  }
}

function showSuccess(data) {
  document.getElementById('loading').style.display = 'none';
  // 自定义订单（代练等无卡密商品）直接跳转到加QQ好友
  if (getQueryParam('custom') === '1') {
    document.getElementById('customContent').style.display = 'block';
    document.getElementById('customAmount').textContent = data.money || '0.00';
    document.getElementById('customProductName').textContent = data.productName || '-';
    document.getElementById('customOrderId').textContent = data.orderId || data.out_trade_no || '-';
    // 倒计时
    var count = 2;
    setInterval(function() {
      count--;
      if (count >= 0) document.getElementById('countdown').textContent = count;
    }, 1000);
    // 2秒后自动跳转
    setTimeout(function() {
      window.location.href = 'https://qm.qq.com/q/7s7UawEbOo';
    }, 2000);
    return;
  }
  document.getElementById('successContent').style.display = 'block';
  document.getElementById('amount').textContent = data.money || '0.00';
  document.getElementById('productName').textContent = data.productName || '-';
  document.getElementById('orderId').textContent = data.orderId || data.out_trade_no || '-';
  document.getElementById('goodsContent').textContent = data.goods || '暂无';
}

function showFail() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('failContent').style.display = 'block';
}

function copyGoods() {
  const goods = document.getElementById('goodsContent').textContent;
  navigator.clipboard.writeText(goods).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '已复制';
    setTimeout(() => { btn.textContent = '复制卡密'; }, 2000);
  }).catch(() => {
    alert('复制失败，请手动复制');
  });
}

function goHome() {
  window.location.href = '/';
}

checkOrder();
</script>
</body>
</html>
