<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>星柚打手接单系统</title>
<style>
:root{--ink:#1c1c1e;--sub:#6e6e73;--brand:#7c5cff;--brand2:#b08cff;--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#f2f2f7}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button,input{font:inherit;color:inherit;border:0;background:none;outline:0}
button{cursor:pointer}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
.bg i{position:absolute;border-radius:50%}
.bg i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,rgba(124,92,255,.38),transparent 65%)}
.bg i:nth-child(2){width:60vmax;height:60vmax;right:-25vmax;top:25vh;background:radial-gradient(circle,rgba(255,120,170,.28),transparent 65%)}
.bg i:nth-child(3){width:65vmax;height:65vmax;left:-20vmax;bottom:-30vmax;background:radial-gradient(circle,rgba(70,170,255,.30),transparent 65%)}
.glass{position:relative;background:rgba(255,255,255,.52);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 10px 30px -12px rgba(60,40,140,.18),inset 0 1px 0 rgba(255,255,255,.8)}
.rim::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,255,255,.08) 38%,rgba(255,255,255,.08) 62%,rgba(255,255,255,.75));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px;position:relative;overflow:hidden;transition:opacity .35s var(--ease),transform .35s var(--ease);background:#f5f6fa;background:radial-gradient(ellipse at 50% 0%,#ffffff 0%,#f2f4f9 60%,#eaeef5 100%)}
.login::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 20% 30%,rgba(59,130,246,.05),transparent 40%),radial-gradient(circle at 80% 70%,rgba(99,102,241,.04),transparent 40%);pointer-events:none}
.login.out{opacity:0;transform:scale(1.02);pointer-events:none}
.lcard{width:100%;max-width:380px;border-radius:28px;padding:32px 26px 26px;text-align:center;background:#fff;border:1px solid rgba(15,23,42,.06);box-shadow:0 20px 50px -18px rgba(30,41,59,.18)}
.logo{width:112px;height:112px;margin:0 auto 14px;border-radius:24px;display:grid;place-items:center;overflow:hidden;background:#f3f5fa}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-size:24px;font-weight:700;letter-spacing:.5px;color:#0f172a}
.sub{color:#64748b;font-size:13px;margin:6px 0 26px}
.group{border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0;text-align:left;overflow:hidden}
.group label{display:flex;align-items:center;height:52px;padding:0 16px;gap:12px}
.group label+label{border-top:1px solid #eef1f6}
.group label span{width:56px;font-size:14px;font-weight:500;color:#64748b}
.group input{flex:1;min-width:0;font-size:16px;color:#0f172a}
.group input::placeholder{color:#94a3b8}
.eye{font-size:13px;color:#2563eb}
.err{height:20px;margin:10px 0 6px;font-size:13px;color:#ef4444}
.primary{width:100%;height:50px;border-radius:14px;color:#fff;font-size:16px;font-weight:600;background:linear-gradient(135deg,#2563eb,#1d4ed8);box-shadow:0 10px 22px -10px rgba(37,99,235,.5);transition:opacity .2s,transform .1s}
.primary:active{transform:scale(.98)}
.primary:disabled{opacity:.6}
.reg-btn{width:100%;height:46px;margin-top:12px;border-radius:14px;color:#475569;font-size:15px;font-weight:500;background:#f1f5f9;border:1px solid #e2e8f0;transition:background .2s}
.reg-btn:active{background:#e2e8f0}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.auth-switch{margin-top:18px;text-align:center}
.auth-switch button{font-size:13px;color:#2563eb;background:none}
.auth-switch button:active{opacity:.7}
.reg-form{display:none}
.reg-form.show{display:block}
.login-form.hide{display:none}
.field-tip{font-size:11px;color:#94a3b8;text-align:center;margin-top:8px;padding:0 4px;line-height:1.5}

#app{display:none;max-width:520px;margin:0 auto;min-height:100dvh}
#app.on{display:block}
.page{display:none;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.page.on{display:block}
.page.on .pc{animation:pin .34s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateY(10px)}}
.bar{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:rgba(242,242,247,.55);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:.5px solid rgba(60,60,67,.12)}
.who{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:linear-gradient(145deg,#9a7bff,#ff8fc4);flex:none}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:16px}
.nm span{font-size:12px;color:var(--sub)}
.pill{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(52,199,89,.14);color:#1f9d46}
.pill i{width:7px;height:7px;border-radius:50%;background:#34c759}
.pill.off{background:rgba(142,142,147,.16);color:#6e6e73}
.pill.off i{background:#8e8e93}
.title{font-size:28px;font-weight:700;margin-bottom:12px;letter-spacing:.3px}
.title.solo{margin-bottom:0}
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:3px;border-radius:13px;background:rgba(118,118,128,.14)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);transform:translateX(calc(var(--i)*100%));transition:transform .4s var(--ease)}
.seg button{position:relative;z-index:1;height:34px;font-size:14px;font-weight:600;color:#3a3a3c;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg em{font-style:normal;font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:grid;place-items:center;color:#6e6e73;background:rgba(118,118,128,.16)}
.pc{padding:14px 16px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-radius:22px;padding:14px 4px;margin-bottom:14px}
.stats div{text-align:center}
.stats div+div{border-left:.5px solid rgba(60,60,67,.14)}
.stats b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--sub)}
.list{display:flex;flex-direction:column;gap:12px}
.card{border-radius:24px;padding:16px}
.card[data-zone=val]{--a1:#ff4f68;--a2:#ff7a5c;--a1t:rgba(255,79,104,.12)}
.card[data-zone=delta]{--a1:#12b886;--a2:#34d17a;--a1t:rgba(18,184,134,.12)}
.card[data-zone=wzry]{--a1:#ff9500;--a2:#ffb340;--a1t:rgba(255,149,0,.13)}
.c-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mode{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;color:var(--a1);background:var(--a1t)}
.znm{font-size:12px;color:var(--sub);margin-left:auto}
.new{font-size:11px;font-weight:700;color:#fff;padding:3px 8px;border-radius:99px;background:linear-gradient(135deg,var(--a1),var(--a2))}
.card:not(.fresh) .new{display:none}
.card h3{font-size:19px;font-weight:700;letter-spacing:.2px}
.desc{font-size:14px;color:var(--sub);margin:4px 0 12px;line-height:1.45}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.55)}
.info span{display:block;font-size:11px;color:var(--sub);margin-bottom:2px}
.info b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 8px;border-radius:99px;font-size:13px;font-weight:500;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 .5px rgba(60,60,67,.12)}
.ic{width:15px;height:15px;fill:currentColor;flex:none}
.im.qq{color:#12b7f5}
.im.wx{color:#07c160}
.os.ios{color:#1c1c1e}
.os.android{color:#3ddc84}
.act{display:flex;align-items:center;gap:12px}
.price{font-size:26px;font-weight:700;color:var(--a1);font-variant-numeric:tabular-nums;line-height:1}
.price small{font-size:14px;margin-right:1px}
.grab{height:38px;padding:0 20px;border-radius:99px;color:#fff;font-weight:600;font-size:15px;white-space:nowrap;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 16px -8px var(--a1);transition:opacity .2s}
.grab:disabled{opacity:.6}
.contact{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.55)}
.contact .ic{width:24px;height:24px}
.contact div{flex:1;min-width:0}
.contact span{display:block;font-size:11px;color:var(--sub)}
.contact b{font-size:16px;font-variant-numeric:tabular-nums;word-break:break-all}
.mini{height:30px;padding:0 14px;border-radius:99px;font-size:13px;font-weight:600;color:var(--brand);background:rgba(124,92,255,.12)}
.st{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px}
.st.doing{color:#0a84ff;background:rgba(10,132,255,.12)}
.st.done{color:#1f9d46;background:rgba(52,199,89,.14)}
.empty{display:none;text-align:center;padding:64px 20px;color:var(--sub);font-size:14px;line-height:1.6}
.empty.show{display:block}
.empty .pulse{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:rgba(124,92,255,.12);display:grid;place-items:center}
.empty .pulse::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--brand);animation:pls 1.8s var(--ease) infinite}
@keyframes pls{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.prof{display:flex;align-items:center;gap:14px;padding:18px;border-radius:24px;margin-bottom:14px}
.prof .av{width:56px;height:56px;font-size:22px}
.prof b{font-size:19px}
.prof span{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.rows{border-radius:22px;overflow:hidden;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;font-size:16px}
.row+.row{border-top:.5px solid rgba(60,60,67,.14)}
.row em{font-style:normal;color:var(--sub);font-variant-numeric:tabular-nums}
.sw{width:51px;height:31px;border-radius:99px;background:rgba(120,120,128,.32);position:relative;transition:background .3s var(--ease)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2);transition:transform .3s var(--ease)}
.sw[aria-checked=true]{background:#34c759}
.sw[aria-checked=true]::after{transform:translateX(20px)}
.logout{width:100%;height:52px;border-radius:18px;color:#ff3b30;font-size:17px;font-weight:600}
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 32px),360px);height:64px;padding:4px;border-radius:99px;display:none;grid-template-columns:repeat(3,1fr);z-index:30;--i:0}
.dock.on{display:grid}
.dock .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:99px;background:rgba(124,92,255,.14);box-shadow:inset 0 0 0 .5px rgba(124,92,255,.18);transform:translateX(calc(var(--i)*100%));transition:transform .45s var(--ease)}
.dock button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#6e6e73;transition:color .3s}
.dock button.on{color:var(--brand)}
.dock svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#ff3b30;color:#fff;font-size:11px;line-height:17px;text-align:center;display:none}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);z-index:50;transform:translate(-50%,-140%);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;max-width:calc(100% - 40px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.svc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin-top:6px}
.svc .dot{width:6px;height:6px;border-radius:50%;background:#8e8e93}
.svc.on .dot{background:#34c759}
/* 聊天面板 */
.chat-panel{position:fixed;inset:0;z-index:200;background:#f2f3f7;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s ease}
.chat-panel.show{transform:none}
.chat-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid rgba(0,0,0,.06);font-weight:700}
.chat-close{background:none;border:none;font-size:18px;color:#666;cursor:pointer}
.chat-box{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.chat-msg{max-width:75%}
.chat-msg.me{align-self:flex-end}
.chat-msg.them{align-self:flex-start}
.chat-bubble{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word}
.chat-name{font-size:11px;color:#999;margin-bottom:3px}
.chat-msg.me .chat-name{text-align:right}
.chat-msg.me .chat-bubble{background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.chat-msg.them .chat-bubble{background:#fff;color:#333;border-bottom-left-radius:4px}
.chat-time{font-size:10px;color:#999;margin-top:3px}
.chat-msg.me .chat-time{text-align:right}
.chat-read{margin-left:6px;color:var(--brand);font-size:10px}
.chat-fail{margin-left:6px;color:#ff3b30;font-size:10px}
.chat-spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-left:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.chat-input{display:flex;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid rgba(0,0,0,.06)}
.chat-input input{flex:1;min-width:0;border:1px solid rgba(0,0,0,.1);border-radius:20px;padding:10px 16px;font-size:14px;outline:none}
.chat-input button{background:var(--brand);color:#fff;border:none;border-radius:20px;padding:0 20px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
</style>
</head>

<script>
/* ===================== 配置 ===================== */
const ZN={val:'无畏契约',delta:'三角洲行动',wzry:'王者荣耀'};
const ZK=Object.keys(ZN);
// 用户端 game id → 打手端 zone id
const GAME_TO_ZONE={val:'val',df:'delta',wz:'wzry'};
const ZONE_TO_GAME={val:'val',delta:'df',wzry:'wz'};
const EASE='cubic-bezier(.32,.72,0,1)';

/* ===================== Supabase 直连客户端 ===================== */
const SB_BASE_URLS=["https://jsrxbpysgaywdhnntqnl.supabase.co"];
function sbProxyUrls(target){
  return [
    "https://cors.eu.org/"+target,
    "https://corsproxy.io/?url="+encodeURIComponent(target),
    "https://api.allorigins.win/raw?url="+encodeURIComponent(target),
    "https://api.codetabs.com/v1/proxy/?quest="+encodeURIComponent(target),
    "https://thingproxy.freeboard.io/fetch/"+target
  ];
}
const SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzcnhicHlzZ2F5d2Robm50cW5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczMzk4ODQsImV4cCI6MjA4MjkxNTg4NH0.-5n_vYPBwD98Hrtw68VkQwQJsiJp4nWW5JhJ0AZfDx0";
const SB_TABLE="user_data";
const SB_TIMEOUT=10000;
let _sbActiveUrl=SB_BASE_URLS[0];
let _sbReachable=false;

async function sbRequest(path,opts){
  const method=(opts&&opts.method)||"GET";
  const body=opts&&opts.body;
  const ms=(opts&&opts.ms)||SB_TIMEOUT;
  const isRpc=path.includes("/rpc/");
  const headers={"apikey":SB_ANON,"Authorization":"Bearer "+SB_ANON};
  if(body!==undefined){
    headers["Content-Type"]="application/json";
    // RPC 调用不需要 resolution=merge-duplicates
    headers["Prefer"]=isRpc?"return=representation":"resolution=merge-duplicates,return=representation";
  }
  const sep=path.includes("?")?"&":"?";
  const proxiedPath=path+sep+"apikey="+encodeURIComponent(SB_ANON);
  const targets=[];
  for(const base of [_sbActiveUrl].concat(SB_BASE_URLS.filter(u=>u!==_sbActiveUrl))){
    targets.push({url:base+path,base,proxy:false});
    for(const pu of sbProxyUrls(base+proxiedPath)) targets.push({url:pu,base,proxy:true});
  }
  let lastErr=null;
  for(const t of targets){
    const ctrl=("AbortController" in window)?new AbortController():null;
    const timer=ctrl?setTimeout(()=>ctrl.abort(),ms):null;
    try{
      const res=await fetch(t.url,{method,headers,body:body!==undefined?JSON.stringify(body):undefined,signal:ctrl?ctrl.signal:undefined});
      if(timer) clearTimeout(timer);
      if(!t.proxy) _sbActiveUrl=t.base;
      const text=await res.text();
      let json=null; try{json=text?JSON.parse(text):null;}catch(e){}
      if(!res.ok){
        const err=new Error((json&&json.message)||("HTTP "+res.status));
        err.code=json&&json.code; err.status=res.status; err.rpc=isRpc;
        throw err;
      }
      _sbReachable=true;
      return json;
    }catch(e){
      if(timer) clearTimeout(timer);
      lastErr=e;
      if(e&&e.name==="AbortError"){ lastErr=new Error("云端请求超时"); lastErr.code="TIMEOUT"; }
    }
  }
  _sbReachable=false;
  throw (lastErr||new Error("云端请求失败"));
}
// 读取所有用户数据（用于聚合待接单订单）
async function sbSelectAll(){
  return await sbRequest("/rest/v1/"+SB_TABLE+"?select=*",{method:"GET",ms:SB_TIMEOUT});
}
// 读取单用户数据
async function sbSelectOne(uid){
  const rows=await sbRequest("/rest/v1/"+SB_TABLE+"?uid=eq."+encodeURIComponent(uid)+"&select=*",{method:"GET",ms:SB_TIMEOUT});
  return (Array.isArray(rows)&&rows[0])||null;
}
// 写入/更新单用户数据
async function sbUpsert(row){
  return await sbRequest("/rest/v1/"+SB_TABLE,{method:"POST",body:row,ms:SB_TIMEOUT});
}
// 部分更新单用户数据（仅更新指定字段，不覆盖同行其他数据）
async function sbPatch(uid,fields){
  return await sbRequest("/rest/v1/"+SB_TABLE+"?uid=eq."+encodeURIComponent(uid),{method:"PATCH",body:fields,ms:SB_TIMEOUT});
}

/* ===================== 工具 ===================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const p2=n=>String(n).padStart(2,'0');
const fmt=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())};
const sameDay=t=>!!t&&new Date(t).toDateString()===new Date().toDateString();
const ic=(id,c)=>`<svg class="ic ${c||''}" aria-hidden="true"><use href="#${id}"/></svg>`;
// 区服判定：QQ区 → qq，微信区 → wx
const zoneOf=s=>/微信/.test(s||'')?'wx':'qq';
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

const state={user:null,zone:'val',tab:'hall',mineTab:'doing',online:true,hall:{val:[],delta:[],wzry:[]},mine:[]};
let toastTimer=0,_pollTimer=null,_svcTimer=null;

/* ===================== 用户订单 → 打手订单映射 ===================== */
function mapOrder(o,ownerUid){
  const zone=GAME_TO_ZONE[o.game]||'val';
  const im=zoneOf(o.server);
  // 标题：优先用 cat+rank，否则 title
  let title=o.title||o.cat||'';
  if(o.rank&&!title.includes(o.rank)) title=(o.cat||'')+' · '+o.rank;
  // 描述：商品描述 + 买家备注 + 区服 + 游戏ID
  const parts=[];
  if(o.desc) parts.push(o.desc);
  if(o.note) parts.push('备注：'+o.note);
  if(o.server) parts.push('区服：'+o.server);
  if(o.gameId) parts.push('游戏ID：'+o.gameId);
  const desc=parts.join('　')||'暂无描述';
  const base={
    zone, mode:o.cat||'陪玩', title:title||o.cat||'陪玩订单', desc,
    im, os:o.platform||null,
    contact:o.customerContact||o.qq||'',
    gameId:o.gameId||'',
    customerName:o.customerName||'客户',
    ct:o.ts||Date.now(), ownerUid,
    qty:o.qty||1, unit:o.unit||'',
    parentNo:o.no,
    boosterCount:o.boosterCount||1,
    commissionEach:o.commissionEach||o.total||0
  };
  // 多打手订单：展开为多个子单卡片
  const subs=o.subOrders&&o.subOrders.length?o.subOrders:[{index:1,status:o.status,grabbedBy:o.grabbedBy,grabbedAt:o.grabbedAt}];
  return subs.map(sub=>({
    ...base,
    id:o.no+'_'+sub.index,
    subIndex:sub.index,
    price:o.commissionEach||o.total||0,
    status:sub.status||o.status,
    grabbedBy:sub.grabbedBy||null,
    grabbedAt:sub.grabbedAt||null,
    doneAt:sub.doneAt||null
  }));
}

/* ===================== 卡片渲染 ===================== */
// 底部标签：区服图标（QQ/微信）+ 系统图标
function chips(o){
  const zoneChip=`<span class="chip">${ic(o.im==='qq'?'i-qq':'i-wechat','im '+o.im)}${o.im==='qq'?'QQ':'微信'}</span>`;
  let osChip='';
  if(o.zone==='wzry'){
    // 王者荣耀：仅显示老板选的设备
    const isIos=o.os==='ios';
    osChip=`<span class="chip">${ic(isIos?'i-apple':'i-android','os '+o.os)}仅限${isIos?'苹果':'安卓'}</span>`;
  }else{
    // 无畏契约/三角洲：安卓苹果均可（双图标）
    osChip=`<span class="chip">${ic('i-android','os android')}${ic('i-apple','os ios')}均可</span>`;
  }
  return zoneChip+osChip;
}
function hallCard(o){
  const fresh=Date.now()-o.ct<10000;
  const boosterTag=o.boosterCount>1?`<span class="new">${o.subIndex}/${o.boosterCount}名额</span>`:'';
  return `<article class="card glass rim${fresh?' fresh':''}" data-id="${o.id}" data-zone="${o.zone}">
<div class="c-top"><span class="mode">${o.mode}</span>${boosterTag}<span class="znm">${ZN[o.zone]}</span></div>
<h3>${o.title}</h3><p class="desc">${o.desc}</p>
<div class="info"><div><span>订单号</span><b>${o.parentNo}</b></div><div><span>下单时间</span><b>${fmt(o.ct)}</b></div><div><span>数量</span><b>${o.qty}${o.unit}</b></div><div><span>游戏ID</span><b>${o.gameId||'未填'}</b></div></div>
<div class="c-foot"><div class="chips">${chips(o)}</div><div class="act"><div class="price"><small>¥</small>${o.price}</div><button class="grab" data-act="grab" data-id="${o.id}">抢单</button></div></div>
</article>`;
}
function mineCard(o){
  const done=o.status==='done';
  const boosterTag=o.boosterCount>1?`<span class="new">${o.subIndex}/${o.boosterCount}名额</span>`:'';
  const orderNo=o.parentNo||(o.id?o.id.split('_')[0]:'');
  const price=o.price||o.total||0;
  return `<article class="card glass rim" data-id="${o.id}" data-zone="${o.zone}">
<div class="c-top"><span class="mode">${o.mode}</span>${boosterTag}<span class="znm">${ZN[o.zone]}</span><span class="st ${done?'done':'doing'}">${done?'已完成':'进行中'}</span></div>
<h3>${o.title}</h3><p class="desc">${o.desc}</p>
<div class="info"><div><span>订单号</span><b>${orderNo}</b></div><div><span>下单时间</span><b>${fmt(o.ct)}</b></div><div><span>抢单时间</span><b>${fmt(o.gt)}</b></div><div><span>我的佣金</span><b>¥${price}</b></div></div>
${o.gameId?`<div class="contact"><div><span>游戏ID</span><b>${o.gameId}</b></div><button class="mini" data-act="copy" data-v="${o.gameId}">复制</button></div>`:''}
<div class="contact"><div><span>联系沟通</span><b>订单聊天房间</b></div><button class="mini" data-act="order-chat" data-id="${o.id}" data-parent="${orderNo}" data-sub="${o.subIndex||1}">进入聊天</button></div>
<div class="c-foot"><div class="chips">${chips(o)}</div>${done?'':`<button class="grab" data-act="done" data-id="${o.id}">完成订单</button>`}</div>
</article>`;
}

/* ===================== 大厅列表管理 ===================== */
function flip(el,fn){
  const prev=new Map([...el.children].filter(c=>c.dataset.id).map(c=>[c.dataset.id,c.getBoundingClientRect().top]));
  fn();
  [...el.children].forEach(c=>{
    const id=c.dataset.id;if(!id)return;
    if(!prev.has(id)){c.animate([{opacity:0,transform:'translateY(-16px) scale(.97)'},{opacity:1,transform:'none'}],{duration:420,easing:EASE});return}
    const dy=prev.get(id)-c.getBoundingClientRect().top;
    if(Math.abs(dy)>1)c.animate([{transform:`translateY(${dy}px)`},{transform:'none'}],{duration:420,easing:EASE});
  });
}
const hallEl=()=>$('#hallList');
function syncHallEmpty(){
  const n=hallEl().querySelectorAll('.card').length;
  $('#hallEmpty').classList.toggle('show',!n);
  $('#hallEmptyT').textContent=state.online?'正在等待新订单':'当前为休息状态';
  $('#hallEmptyS').textContent=state.online?'客户支付后订单会出现在这里':'开启接单后才会收到新订单';
}
function setZone(z){
  state.zone=z;
  $('#zoneSeg').style.setProperty('--i',ZK.indexOf(z));
  const el=hallEl();
  el.innerHTML=state.hall[z].map(hallCard).join('');
  syncHallEmpty();
  el.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:300,easing:EASE});
}

/* ===================== 我的订单 ===================== */
function setMineTab(v,anim){
  state.mineTab=v;
  $('#mineSeg').style.setProperty('--i',v==='doing'?0:1);
  renderMine(anim);
}
function renderMine(anim){
  const list=state.mine.filter(o=>o.status===state.mineTab);
  const el=$('#mineList');
  el.innerHTML=list.map(mineCard).join('');
  $('#mineEmpty').classList.toggle('show',!list.length);
  const doing=state.mineTab==='doing';
  $('#mineEmptyT').textContent=doing?'暂无进行中的订单':'暂无已完成订单';

/* ===================== 抢单 / 完成（回写云端） ===================== */
async function updateOwnerOrder(ownerUid,orderNo,updater){
  const row=await sbSelectOne(ownerUid);
  if(!row||!Array.isArray(row.orders)) return false;
  const orders=row.orders;
  const idx=orders.findIndex(o=>o.no===orderNo);
  if(idx<0) return false;
  updater(orders[idx],idx,orders);
  // 仅 PATCH orders 字段，不覆盖同行其他数据（优惠券/收藏等）
  await sbPatch(ownerUid,{orders});
  return true;
}

async function grab(id,btn){
  const o=state.hall[state.zone].find(x=>x.id===id);
  if(!o||o.busy||o.gone) return;
  if(!state.online){toast('当前为休息状态，请先开启接单');return}
  o.busy=true;btn.disabled=true;btn.textContent='抢单中…';
  try{
    // 解析子单：id = parentNo_index
    const parts=id.split('_');
    const parentNo=parts.slice(0,-1).join('_');
    const subIndex=parseInt(parts[parts.length-1],10);
    // 先读云端确认对应子单仍为 pending（防止并发抢单）
    const row=await sbSelectOne(o.ownerUid);
    const cloudOrder=row&&Array.isArray(row.orders)?row.orders.find(x=>x.no===parentNo):null;
    if(!cloudOrder||cloudOrder.status!=='pending'){
      toast('手慢了，订单已被抢走');
      removeHall(o);
      return;
    }
    const sub=(cloudOrder.subOrders||[]).find(s=>s.index===subIndex);
    if(!sub||sub.status!=='pending'){
      toast('手慢了，该名额已被抢走');
      removeHall(o);
      return;
    }
    // 乐观更新：先加入我的订单
    const m={...o,status:'doing',gt:Date.now(),grabbedBy:state.user};
    delete m.busy;delete m.gone;
    state.mine.unshift(m);
    saveMine();updateCounts();
    if(state.tab==='mine')renderMine();
    // 从大厅移除
    removeHall(o);
    // 回写云端：把对应子单状态改为 ongoing
    let alreadyTaken=false;
    const ok=await updateOwnerOrder(o.ownerUid,parentNo,(od)=>{
      if(od.status!=='pending'){ alreadyTaken=true; return; }
      const s=(od.subOrders||[]).find(x=>x.index===subIndex);
      if(!s||s.status!=='pending'){ alreadyTaken=true; return; }
      s.status='ongoing';
      s.grabbedBy=state.user;
      s.grabbedAt=Date.now();
    });
    if(ok && !alreadyTaken){
      toast('抢单成功，请等待客服提供联系方式');
      if(navigator.vibrate)navigator.vibrate(12);
    }else{
      toast('手慢了，该名额已被抢走');
      // 回滚：从我的订单移除
      state.mine=state.mine.filter(x=>x.id!==o.id);
      saveMine();updateCounts();
      if(state.tab==='mine')renderMine();
    }
  }catch(e){
    console.error(e);
    toast('抢单失败：'+(e.message||'网络错误'));
    // 回滚
    state.mine=state.mine.filter(x=>x.id!==o.id);
    saveMine();updateCounts();
    if(state.tab==='mine')renderMine();
    btn.disabled=false;btn.textContent='抢单';
    o.busy=false;
  }
}

async function complete(id){
  const o=state.mine.find(x=>x.id===id);if(!o)return;
  try{
    const parts=id.split('_');
    const parentNo=parts.slice(0,-1).join('_');
    const subIndex=parseInt(parts[parts.length-1],10);
    const ok=await updateOwnerOrder(o.ownerUid,parentNo,(od)=>{
      const s=(od.subOrders||[]).find(x=>x.index===subIndex);
      if(s){ s.status='done'; s.doneAt=Date.now(); }
      else { od.status='done'; od.doneAt=Date.now(); }
    });
    if(!ok){toast('操作失败：订单不存在');return}
    o.status='done';o.doneAt=Date.now();
    state.mine.sort((a,b)=>(b.doneAt||b.gt)-(a.doneAt||a.gt));
    saveMine();updateCounts();
    const node=$(`#mineList [data-id="${id}"]`);
    const finish=()=>renderMine();
    if(node)node.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.96)'}],{duration:220,easing:'ease-out',fill:'forwards'}).onfinish=finish;else finish();
    toast('订单已完成 +¥'+o.price);
  }catch(e){
    console.error(e);
    toast('操作失败：'+(e.message||'网络错误'));
  }
}

function removeHall(o){
  if(o.gone)return;
  o.gone=true;
  const arr=state.hall[o.zone],i=arr.indexOf(o);
  if(i>-1)arr.splice(i,1);
  updateCounts();
  if(o.zone!==state.zone)return;
  const el=hallEl(),node=el.querySelector(`[data-id="${o.id}"]`);
  if(!node){syncHallEmpty();return}
  const a=node.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.96)'}],{duration:220,easing:'ease-out',fill:'forwards'});
  a.onfinish=()=>{flip(el,()=>node.remove());syncHallEmpty()};
}

/* ===================== 从云端拉取待接单订单 ===================== */
async function fetchPendingOrders(){
  try{
    const rows=await sbSelectAll();
    setSvc(true);
    if(!Array.isArray(rows)) return;
    const seen=new Set(state.mine.map(m=>m.id)); // 已抢的不再显示
    const all={val:[],delta:[],wzry:[]};
    for(const row of rows){
      if(!row||!row.uid||!Array.isArray(row.orders)) continue;
      for(const o of row.orders){
        if(!o||o.status!=='pending') continue;
        const subs=mapOrder(o,row.uid);
        for(const m of subs){
          if(seen.has(m.id)) continue;
          if(m.status!=='pending') continue; // 子单已被抢则跳过
          all[m.zone].push(m);
        }
      }
    }
    // 按下单时间倒序
    ZK.forEach(z=>all[z].sort((a,b)=>b.ct-a.ct));
    // 合并到 state.hall：保留已存在的，新增的插到前面，已消失的移除
    ZK.forEach(z=>{
      const newIds=new Set(all[z].map(o=>o.id));
      const oldIds=new Set(state.hall[z].map(o=>o.id));
      // 移除已被抢走/消失的
      state.hall[z]=state.hall[z].filter(o=>newIds.has(o.id));
      // 添加新的
      for(const o of all[z]){
        if(!oldIds.has(o.id)) state.hall[z].unshift(o);
      }
      state.hall[z].sort((a,b)=>b.ct-a.ct);
    });
    // 重新渲染当前区
    if(state.tab==='hall'){
      const el=hallEl();
      const curIds=new Set(state.hall[state.zone].map(o=>o.id));
      // 移除消失的
      [...el.children].forEach(c=>{if(c.dataset.id&&!curIds.has(c.dataset.id))c.remove()});
      // 插入新的
      const existIds=new Set([...el.children].map(c=>c.dataset.id));
      for(const o of state.hall[state.zone]){
        if(!existIds.has(o.id)){
          flip(el,()=>el.insertAdjacentHTML('afterbegin',hallCard(o)));
        }
      }
      syncHallEmpty();
    }
    updateCounts();
  }catch(e){
    console.error('[拉取订单]',e);
    setSvc(false);
  }
}

}

});

// 注册：校验后写入云端账号表（密码 SHA256 哈希存储）
$('#regForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const u=$('#ru').value.trim(),p=$('#rp').value,code=$('#rc').value.trim(),btn=$('#regBtn');
  if(!u||!p||!code){rfail('请填写用户名、密码和邀请码');return}
  if(!/^[\u4e00-\u9fa5A-Za-z0-9]{2,16}$/.test(u)){rfail('用户名需为中文、英文或数字，2-16位');return}
  if(p.length<6){rfail('密码至少6位');return}
  if(!/[a-zA-Z]/.test(p)){rfail('密码必须包含英文字母');return}
  if(!/[\u4e00-\u9fa5]/.test(p)){rfail('密码必须包含中文字符');return}
  if(code!==INVITE_CODE){rfail('邀请码不正确');return}
  btn.disabled=true;btn.textContent='注册中…';
  try{
    const list=await getAccounts();
    if(list.some(a=>a.username===u)){rfail('该用户名已被注册');btn.disabled=false;btn.textContent='注册打手';return}
    const hash=hashPwd(p);
    list.push({username:u,password_hash:hash,created_at:Date.now()});
    await saveAccounts(list);
    $('#rerr').textContent='';
    toast('注册成功，请登录');
    $('#u').value=u;$('#p').value='';
    showLogin();
  }catch(err){
    rfail('网络错误，请重试');
  }finally{
    btn.disabled=false;btn.textContent='注册打手';
  }
});

// 自动登录：上次成功登录的用户名直接进入（会话信任）
const saved=store.get('xy_user');
if(saved){enter(saved,true)}

/* ===================== 订单聊天房间 ===================== */
const CHAT_UID='xy_chat_messages';
let chatOrderNo='',chatSubIndex=1,chatPollTimer=null,_chatCache=[];
async function getMessages(){
  const row=await sbSelectOne(CHAT_UID);
  _chatCache=(row&&Array.isArray(row.orders))?row.orders:[];
  return _chatCache;
}
async function saveMessages(list){
  _chatCache=list;
  await sbUpsert({uid:CHAT_UID,orders:list});
}
// 打手在房间中的显示名：打手1、打手2...
function chatDisplayName(){return '打手'+chatSubIndex;}
async function sendChat(content){
  if(!content.trim())return;
  const msg={id:'M'+Date.now()+Math.floor(Math.random()*1000),from:chatDisplayName(),fromRole:'booster',to:'all',toRole:'all',content:content.trim(),ts:Date.now(),orderNo:chatOrderNo,readBy:[],sending:true};
  _chatCache.push(msg);
  renderChat(_chatCache);
  try{
    const toSave=_chatCache.map(m=>{const c={...m};delete c.sending;delete c.failed;return c;});
    await saveMessages(toSave);
    msg.sending=false;
    renderChat(_chatCache);
  }catch(e){
    console.error(e);
    msg.sending=false;
    msg.failed=true;
    renderChat(_chatCache);
    toast('发送失败：'+(e.message||'网络错误'));
  }
}
function renderChat(list){
  const box=$('#chatBox');if(!box)return;
  const mine=list.filter(m=>m.orderNo===chatOrderNo);
  mine.sort((a,b)=>a.ts-b.ts);
  box.innerHTML=mine.map(m=>{
    const isMe=m.from===chatDisplayName();
    // 已读人数 = readBy 中排除发送者自己
    const readCount=(m.readBy||[]).filter(r=>r!==m.from).length;
    let readTxt='';
    if(isMe&&!m.sending){
      if(readCount>=3)readTxt='<span class="chat-read">三人已读</span>';
      else if(readCount===2)readTxt='<span class="chat-read">两人已读</span>';
      else if(readCount===1)readTxt='<span class="chat-read">已读</span>';
    }
    const spinner=m.sending?'<span class="chat-spin"></span>':'';
    const fail=m.failed?'<span class="chat-fail">发送失败</span>':'';
    return `<div class="chat-msg ${isMe?'me':'them'}"><div class="chat-name">${esc(m.from)}</div><div class="chat-bubble">${esc(m.content)}${spinner}</div><div class="chat-time">${fmt(m.ts)}${readTxt}${fail}</div></div>`;
  }).join('');
  box.scrollTop=box.scrollHeight;
}
async function pollChat(){
  try{
    await getMessages();
    // 云端消息已保存，清除临时 sending 字段
    let hasSending=false;
    _chatCache.forEach(m=>{if(m.sending!==undefined){hasSending=true;delete m.sending;}});
    // 标记当前房间**别人发的**消息为已读（自己发的不算）
    const me=chatDisplayName();
    let changed=hasSending;
    _chatCache.forEach(m=>{
      if(m.orderNo===chatOrderNo&&m.from!==me){
        if(!m.readBy)m.readBy=[];
        if(!m.readBy.includes(me)){m.readBy.push(me);changed=true;}
      }
    });
    if(changed){
      const toSave=_chatCache.map(m=>{const c={...m};delete c.sending;delete c.failed;return c;});
      await saveMessages(toSave);
    }
    renderChat(_chatCache);
  }catch(e){}
}
function openOrderChat(orderNo,subIndex){
  chatOrderNo=orderNo||'';
  chatSubIndex=subIndex||1;
  $('#chatTitle').textContent='订单 '+chatOrderNo+' · 打手'+chatSubIndex;
  $('#chatPanel').classList.add('show');
  pollChat();
  chatPollTimer=setInterval(pollChat,3000);
}
function closeChat(){
  $('#chatPanel').classList.remove('show');
  if(chatPollTimer){clearInterval(chatPollTimer);chatPollTimer=null;}
}
</script>
<!-- 聊天面板 -->
<div id="chatPanel" class="chat-panel">
  <div class="chat-head"><span id="chatTitle">订单聊天</span><button class="chat-close" data-act="close-chat">✕</button></div>
  <div id="chatBox" class="chat-box"></div>
  <div class="chat-input">
    <input id="chatInput" placeholder="输入消息…" maxlength="200">
    <button id="chatSend" data-act="send-chat">发送</button>
  </div>
</div>
